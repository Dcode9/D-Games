<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <title>Tag original cover art</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f0c8"/>
      <stop offset="100%" stop-color="#f4ecd2"/>
    </linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b9e56"/>
      <stop offset="100%" stop-color="#4e7a3e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <circle cx="520" cy="86" r="130" fill="#a8d672" opacity="0.28"/>
  <circle cx="96" cy="360" r="150" fill="#ffffff" opacity="0.35"/>

  <!-- Arena Platforms -->
  <rect x="44" y="326" width="552" height="32" rx="10" fill="#5b4632"/>
  <rect x="44" y="326" width="552" height="12" rx="6" fill="url(#plat)"/>

  <rect x="86" y="224" width="186" height="22" rx="8" fill="#5b4632"/>
  <rect x="86" y="224" width="186" height="9" rx="4" fill="url(#plat)"/>

  <rect x="358" y="182" width="198" height="22" rx="8" fill="#5b4632"/>
  <rect x="358" y="182" width="198" height="9" rx="4" fill="url(#plat)"/>

  <!-- Jump Pad -->
  <rect x="292" y="314" width="54" height="12" rx="5" fill="#f59e0b" stroke="#242a2a" stroke-width="3"/>
  <path d="M302 314 L336 314" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>

  <!-- Portal Ring -->
  <ellipse cx="524" cy="144" rx="14" ry="28" fill="#38bdf8" opacity="0.25" stroke="#0284c7" stroke-width="5"/>
  <ellipse cx="524" cy="144" rx="6" ry="16" fill="#bae6fd" opacity="0.7"/>

  <!-- Motion Arc -->
  <path d="M214 198 Q304 94 398 148" fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="9 9" stroke-linecap="round" opacity="0.6"/>

  <!-- Runner Character (Blue) -->
  <g transform="translate(418,136)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#2563eb" stroke="#1e293b" stroke-width="4"/>
    <circle cx="30" cy="18" r="5" fill="#ffffff"/>
    <circle cx="32" cy="18" r="2.4" fill="#0f172a"/>
    <circle cx="16" cy="18" r="5" fill="#ffffff"/>
    <circle cx="18" cy="18" r="2.4" fill="#0f172a"/>
    <path d="M18 32 Q25 36 32 31" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Chaser Character (Red - IT) -->
  <g transform="translate(152,174)">
    <!-- Floating IT arrow -->
    <polygon points="24,-14 12,-34 36,-34" fill="#e11d48" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#ef4444" stroke="#1e293b" stroke-width="4"/>
    <circle cx="32" cy="18" r="5" fill="#ffffff"/>
    <circle cx="34" cy="18" r="2.4" fill="#0f172a"/>
    <circle cx="17" cy="18" r="5" fill="#ffffff"/>
    <circle cx="19" cy="18" r="2.4" fill="#0f172a"/>
    <path d="M12 11 L22 14 M38 11 L28 14" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path d="M17 33 Q24 29 31 33" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
