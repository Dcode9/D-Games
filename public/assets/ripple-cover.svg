<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="ripple-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="60%" stop-color="#060c14"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="rglow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#ripple-bg)"/>
  
  <!-- Concentric Ripples -->
  <circle cx="600" cy="337" r="40" fill="none" stroke="url(#wave-grad)" stroke-width="3" filter="url(#rglow)"/>
  <circle cx="600" cy="337" r="90" fill="none" stroke="url(#wave-grad)" stroke-width="2.5" opacity="0.9" filter="url(#rglow)"/>
  <circle cx="600" cy="337" r="160" fill="none" stroke="url(#wave-grad)" stroke-width="2" opacity="0.7"/>
  <circle cx="600" cy="337" r="250" fill="none" stroke="url(#wave-grad)" stroke-width="1.5" opacity="0.45"/>
  <circle cx="600" cy="337" r="360" fill="none" stroke="url(#wave-grad)" stroke-width="1" opacity="0.25"/>

  <!-- Secondary Ripple Origin -->
  <circle cx="820" cy="220" r="30" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.8" filter="url(#rglow)"/>
  <circle cx="820" cy="220" r="75" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="820" cy="220" r="140" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.3"/>

  <!-- Nodes -->
  <circle cx="600" cy="337" r="12" fill="#2dd4bf" filter="url(#rglow)"/>
  <circle cx="820" cy="220" r="8" fill="#f43f5e" filter="url(#rglow)"/>

  <!-- Typography -->
  <text x="80" y="550" fill="#ffffff" font-family="'Space Grotesk', Inter, sans-serif" font-size="70" font-weight="900" letter-spacing="-1">RIPPLE REACTION</text>
  <text x="85" y="595" fill="#2dd4bf" font-family="'Space Grotesk', Inter, sans-serif" font-size="20" font-weight="700" letter-spacing="4">CHAIN REACTION HARMONICS</text>
</svg>
