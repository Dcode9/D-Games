<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Snake — D'Games</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06070c;
  --surface: rgba(14, 16, 24, 0.85);
  --border: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: #f4f4f5;
  font-family: 'Inter', system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
.font-display { font-family: 'Space Grotesk', sans-serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }

.glass-panel {
  background: var(--surface);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
}

.action-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  transition: all 0.15s ease;
}
.action-btn:active {
  background: rgba(255, 255, 255, 0.18);
  transform: scale(0.95);
}

canvas { display: block; }
</style>
</head>
<body class="flex flex-col items-center justify-between p-2 sm:p-4">

  <!-- TOP HEADER HUD -->
  <header class="w-full max-w-md flex items-center justify-between px-3 py-2 rounded-2xl glass-panel flex-shrink-0 z-20">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
      <h1 class="font-display text-sm sm:text-base font-bold text-white tracking-tight">NEON SNAKE</h1>
    </div>

    <div class="flex items-center gap-4 text-xs font-mono">
      <div class="text-right">
        <span class="text-[10px] text-zinc-500 uppercase">Score</span>
        <div id="hud-score" class="font-bold text-white tabular-nums text-sm sm:text-base">0</div>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-zinc-500 uppercase">Length</span>
        <div id="hud-len" class="font-bold text-emerald-400 tabular-nums text-sm sm:text-base">3</div>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-zinc-500 uppercase">Best</span>
        <div id="hud-best" class="font-bold text-amber-400 tabular-nums text-sm sm:text-base">0</div>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button id="btn-sound" class="action-btn w-8 h-8 rounded-xl flex items-center justify-center text-xs text-zinc-300" title="Toggle Sound">
        🔊
      </button>
      <button id="btn-pause" class="action-btn w-8 h-8 rounded-xl flex items-center justify-center text-xs text-zinc-300" title="Pause Game">
        ⏸
      </button>
    </div>
  </header>

  <!-- MAIN GAMEPLAY CANVAS CONTAINER -->
  <main class="relative flex items-center justify-center my-auto z-10 w-full max-w-md">
    <div class="glass-panel p-1.5 rounded-2xl shadow-2xl relative overflow-hidden">
      <canvas id="game-canvas" width="400" height="400" class="rounded-xl"></canvas>
    </div>
  </main>

  <!-- MOBILE ON-SCREEN D-PAD -->
  <footer class="w-full max-w-xs sm:hidden flex flex-col items-center gap-1.5 z-20 pb-2">
    <button id="btn-m-up" class="action-btn w-12 h-12 rounded-xl text-lg flex items-center justify-center">▲</button>
    <div class="flex items-center gap-3">
      <button id="btn-m-left" class="action-btn w-12 h-12 rounded-xl text-lg flex items-center justify-center">◀</button>
      <button id="btn-m-down" class="action-btn w-12 h-12 rounded-xl text-lg flex items-center justify-center">▼</button>
      <button id="btn-m-right" class="action-btn w-12 h-12 rounded-xl text-lg flex items-center justify-center">▶</button>
    </div>
  </footer>

  <!-- DESKTOP HINTS -->
  <div class="hidden sm:flex items-center justify-center gap-4 text-[11px] font-mono text-zinc-500 mb-1 z-20">
    <span>Control: <kbd class="px-1.5 py-0.5 rounded bg-white/10 text-zinc-300">Arrow Keys</kbd> or <kbd class="px-1.5 py-0.5 rounded bg-white/10 text-zinc-300">WASD</kbd></span>
    <span>Pause: <kbd class="px-1.5 py-0.5 rounded bg-white/10 text-zinc-300">P</kbd></span>
  </div>

  <!-- START OVERLAY -->
  <div id="overlay-start" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
    <div class="glass-panel p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto">
        🐍
      </div>
      <div>
        <h2 class="font-display text-2xl font-bold text-white">NEON SNAKE</h2>
        <p class="text-xs text-zinc-400 mt-1">Buffered directional queue, multi-phase energy crystals, speed progression, and acoustic chimes.</p>
      </div>
      <button id="btn-start" class="w-full py-3 rounded-xl bg-white text-black font-semibold text-xs uppercase tracking-wider hover:bg-zinc-200 transition-colors cursor-pointer">
        Start Game
      </button>
    </div>
  </div>

  <!-- PAUSE OVERLAY -->
  <div id="overlay-pause" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div class="glass-panel p-6 rounded-3xl max-w-xs w-full text-center space-y-4">
      <h3 class="font-display text-xl font-bold text-white">Paused</h3>
      <div class="space-y-2">
        <button id="btn-resume" class="w-full py-2.5 rounded-xl bg-white text-black font-medium text-xs">Resume</button>
        <button id="btn-restart" class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white font-medium text-xs">Restart</button>
      </div>
    </div>
  </div>

  <!-- GAME OVER OVERLAY -->
  <div id="overlay-gameover" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
    <div class="glass-panel p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center space-y-4">
      <span class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest">Matrix Collision</span>
      <h2 class="font-display text-2xl font-bold text-white">GAME OVER</h2>
      <div class="py-2 border-y border-white/10 space-y-1">
        <div class="flex justify-between text-xs text-zinc-400">
          <span>Score</span>
          <span id="go-score" class="text-white font-mono font-bold">0</span>
        </div>
        <div class="flex justify-between text-xs text-zinc-400">
          <span>Final Length</span>
          <span id="go-len" class="text-emerald-400 font-mono font-bold">3</span>
        </div>
        <div class="flex justify-between text-xs text-zinc-400">
          <span>Best Score</span>
          <span id="go-best" class="text-amber-400 font-mono font-bold">0</span>
        </div>
      </div>
      <button id="btn-playagain" class="w-full py-3 rounded-xl bg-white text-black font-semibold text-xs uppercase tracking-wider hover:bg-zinc-200 transition-colors cursor-pointer">
        Play Again
      </button>
    </div>
  </div>

<script>
// --- PROCEDURAL WEB AUDIO SYNTHESIZER ---
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.08) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

const sfx = {
  turn: () => playTone(280, 'sine', 0.03, 0.04),
  eat: () => {
    if (!soundEnabled || !audioCtx) return;
    [520, 650].forEach((f, idx) => setTimeout(() => playTone(f, 'sine', 0.08, 0.09), idx * 40));
  },
  bonus: () => {
    if (!soundEnabled || !audioCtx) return;
    [600, 750, 900].forEach((f, idx) => setTimeout(() => playTone(f, 'triangle', 0.1, 0.1), idx * 50));
  },
  die: () => {
    if (!soundEnabled || !audioCtx) return;
    [240, 180, 120].forEach((f, idx) => setTimeout(() => playTone(f, 'sawtooth', 0.15, 0.1), idx * 80));
  }
};

document.getElementById('btn-sound').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  document.getElementById('btn-sound').textContent = soundEnabled ? '🔊' : '🔇';
});

// --- GAME LOGIC ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 20; // 20x20 Grid
let CELL = 20;

function resizeBoard() {
  const maxDim = Math.min(window.innerWidth - 32, window.innerHeight - 200, 420);
  CELL = Math.floor(maxDim / GRID_SIZE);
  canvas.width = CELL * GRID_SIZE;
  canvas.height = CELL * GRID_SIZE;
}
window.addEventListener('resize', () => {
  resizeBoard();
  draw();
});
resizeBoard();

let snake = [];
let dir = { x: 1, y: 0 };
let inputQueue = []; // FIFO input buffer to prevent fast-click suicide
let food = { x: 15, y: 10 };
let bonus = null;
let bonusTimer = 0;
let score = 0;
let bestScore = +localStorage.getItem('neon-snake-best') || 0;
let running = false;
let paused = false;
let lastTick = 0;
let particles = [];

function initGame() {
  const startX = Math.floor(GRID_SIZE / 2);
  const startY = Math.floor(GRID_SIZE / 2);
  snake = [
    { x: startX, y: startY },
    { x: startX - 1, y: startY },
    { x: startX - 2, y: startY }
  ];
  dir = { x: 1, y: 0 };
  inputQueue = [];
  score = 0;
  bonus = null;
  bonusTimer = 0;
  particles = [];
  running = true;
  paused = false;
  lastTick = performance.now();
  spawnFood();
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-len').textContent = snake.length;
  document.getElementById('hud-best').textContent = bestScore;
}

function spawnFood() {
  let valid = false;
  while (!valid) {
    food = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function maybeSpawnBonus() {
  if (!bonus && Math.random() < 0.25) {
    let valid = false;
    let bPos = { x: 0, y: 0 };
    while (!valid) {
      bPos = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
      valid = !snake.some(s => s.x === bPos.x && s.y === bPos.y) && !(food.x === bPos.x && food.y === bPos.y);
    }
    bonus = { ...bPos, type: Math.random() < 0.6 ? 'gem' : 'trim' };
    bonusTimer = 70; // ticks before expire
  }
}

function spawnParticles(x, y, color) {
  const px = x * CELL + CELL / 2;
  const py = y * CELL + CELL / 2;
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: px, y: py,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      color,
      life: 1.0
    });
  }
}

// Direction Input Queue
function queueDirection(newDir) {
  const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : dir;
  // Prevent 180-degree reverse
  if (newDir.x !== -lastDir.x && newDir.y !== -lastDir.y) {
    if (inputQueue.length < 3) {
      inputQueue.push(newDir);
      sfx.turn();
    }
  }
}

// Tick Step
function step() {
  if (inputQueue.length > 0) {
    dir = inputQueue.shift();
  }

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall Collision
  if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
    gameOver();
    return;
  }

  // Self Collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  // Eat Standard Food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    sfx.eat();
    spawnParticles(food.x, food.y, '#10b981');
    spawnFood();
    maybeSpawnBonus();
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('neon-snake-best', bestScore);
    }
    updateHUD();
  } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
    // Eat Bonus
    sfx.bonus();
    spawnParticles(bonus.x, bonus.y, bonus.type === 'gem' ? '#f59e0b' : '#a855f7');
    if (bonus.type === 'gem') {
      score += 50;
    } else {
      score += 25;
      if (snake.length > 4) snake.splice(-3);
    }
    bonus = null;
    bonusTimer = 0;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('neon-snake-best', bestScore);
    }
    updateHUD();
  } else {
    snake.pop();
  }

  if (bonusTimer > 0) {
    bonusTimer--;
    if (bonusTimer === 0) bonus = null;
  }
}

// --- DRAWING ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Subtle Matrix Grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // Standard Food (Apple Core)
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  ctx.fillStyle = '#f43f5e';
  ctx.beginPath();
  ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // Bonus Item
  if (bonus) {
    const bx = bonus.x * CELL + CELL / 2;
    const by = bonus.y * CELL + CELL / 2;
    ctx.fillStyle = bonus.type === 'gem' ? '#f59e0b' : '#a855f7';
    ctx.beginPath();
    ctx.arc(bx, by, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bonus.type === 'gem' ? '★' : '✂', bx, by);
  }

  // Snake Body
  snake.forEach((s, idx) => {
    const px = s.x * CELL;
    const py = s.y * CELL;

    if (idx === 0) {
      // Head
      ctx.fillStyle = '#34d399';
      ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);

      // Eye
      ctx.fillStyle = '#000000';
      const eyeOffset = CELL / 4;
      const eyeX = px + CELL / 2 + dir.x * eyeOffset;
      const eyeY = py + CELL / 2 + dir.y * eyeOffset;
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Body gradient
      const alpha = Math.max(0.35, 1 - (idx / snake.length) * 0.65);
      ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
      ctx.fillRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
    }
  });

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life -= 0.03;
    if (pt.life <= 0) {
      particles.splice(i, 1);
    } else {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.life;
      ctx.fillRect(pt.x, pt.y, 2.5, 2.5);
      ctx.globalAlpha = 1.0;
    }
  }
}

// --- GAME LOOP ---
function update(now = 0) {
  if (running && !paused) {
    // Dynamic Speed: starts at 130ms, speeds up to 60ms
    const speed = Math.max(60, 130 - Math.floor(score / 30) * 8);
    if (now - lastTick > speed) {
      step();
      lastTick = now;
    }
    draw();
  }
  requestAnimationFrame(update);
}

function gameOver() {
  running = false;
  sfx.die();
  document.getElementById('go-score').textContent = score;
  document.getElementById('go-len').textContent = snake.length;
  document.getElementById('go-best').textContent = bestScore;
  document.getElementById('overlay-gameover').classList.remove('hidden');
}

// --- KEYBOARD & CONTROLS ---
window.addEventListener('keydown', e => {
  if (!running || paused) {
    if (e.key === 'p' || e.key === 'P') togglePause();
    return;
  }
  initAudio();

  switch (e.key) {
    case 'ArrowUp':
    case 'w':
    case 'W':
      queueDirection({ x: 0, y: -1 });
      break;
    case 'ArrowDown':
    case 's':
    case 'S':
      queueDirection({ x: 0, y: 1 });
      break;
    case 'ArrowLeft':
    case 'a':
    case 'A':
      queueDirection({ x: -1, y: 0 });
      break;
    case 'ArrowRight':
    case 'd':
    case 'D':
      queueDirection({ x: 1, y: 0 });
      break;
    case 'p':
    case 'P':
    case 'Escape':
      togglePause();
      break;
  }
});

// Mobile Controls
document.getElementById('btn-m-up').addEventListener('click', () => queueDirection({ x: 0, y: -1 }));
document.getElementById('btn-m-down').addEventListener('click', () => queueDirection({ x: 0, y: 1 }));
document.getElementById('btn-m-left').addEventListener('click', () => queueDirection({ x: -1, y: 0 }));
document.getElementById('btn-m-right').addEventListener('click', () => queueDirection({ x: 1, y: 0 }));

// Touch Swipes
let touchStartX = 0;
let touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', e => {
  if (!running || paused) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.hypot(dx, dy) > 20) {
    if (Math.abs(dx) > Math.abs(dy)) {
      queueDirection({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      queueDirection({ x: 0, y: dy > 0 ? 1 : -1 });
    }
  }
}, { passive: true });

// Overlays & UI
function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById('overlay-pause').classList.toggle('hidden', !paused);
}

document.getElementById('btn-pause').addEventListener('click', togglePause);
document.getElementById('btn-resume').addEventListener('click', togglePause);
document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('overlay-pause').classList.add('hidden');
  initGame();
});

document.getElementById('btn-start').addEventListener('click', () => {
  initAudio();
  document.getElementById('overlay-start').classList.add('hidden');
  initGame();
});

document.getElementById('btn-playagain').addEventListener('click', () => {
  initAudio();
  document.getElementById('overlay-gameover').classList.add('hidden');
  initGame();
});

requestAnimationFrame(update);
</script>
</body>
</html>
