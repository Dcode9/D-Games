<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9d1be">
<title>Parcel Sort — D'Games</title>
<link rel="stylesheet" href="/assets/dgames-ui.css">
<style>
*{box-sizing:border-box}
:root{--paper:#d9d1be;--paper2:#eee8d9;--ink:#242a2a;--muted:#6f746e;--olive:#718466;--brick:#a85d49;
 --g:#2fbf55;--gd:#1c7d36;--b:#2f72e6;--bd:#1b4aa6;--r:#e64a3c;--rd:#a4281e}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:3;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.top{margin-top:max(60px,calc(env(safe-area-inset-top) + 56px));display:flex;gap:6px;align-items:center;padding:4px 9px;border:2px solid #242a2a55;border-radius:11px;background:#eee8d9ee;box-shadow:0 4px 0 #242a2a18}
.stat{min-width:64px;text-align:center}.stat small{display:block;font:800 7px/1 ui-monospace,monospace;letter-spacing:.13em;color:var(--muted)}.stat b{display:block;margin-top:3px;font:900 15px/1 ui-monospace,monospace}
#combo{color:var(--brick)}
.hrow{display:flex;gap:6px;align-items:center;width:calc(100% - 16px);max-width:560px;margin-top:5px}.hint{flex:1;margin:0;padding:4px 8px;border:1px solid #242a2a28;border-radius:9px;background:#eee8d9f2;color:#3b423f;font:800 9px/1.3 ui-monospace,monospace;letter-spacing:.02em;text-align:center;min-height:0}
.hint em{font-style:normal;color:var(--brick)}
.tools{margin:0;display:flex;gap:5px;pointer-events:auto;flex:none}
.mini{border:2px solid #242a2a66;border-radius:9px;background:#eee8d9;color:var(--ink);font:900 8px/1 ui-monospace,monospace;letter-spacing:.08em;padding:7px 6px;cursor:pointer;box-shadow:0 3px 0 #242a2a30}
.mini:active{transform:translateY(3px);box-shadow:0 0 0 #242a2a30}
.mini[aria-pressed="true"]{background:#242a2a;color:#eee8d9}
.bins{position:absolute;left:50%;bottom:max(60px,calc(env(safe-area-inset-bottom) + 56px));transform:translateX(-50%);width:min(640px,calc(100% - 22px));display:grid;grid-template-columns:repeat(3,1fr);gap:12px;pointer-events:auto}
/* tactile keycaps: a dark base plate, a raised cap that sinks when pressed */
.bin{position:relative;min-height:76px;padding:0;border:0;border-radius:18px;background:var(--base);cursor:pointer;color:#fff;-webkit-appearance:none;appearance:none;outline:none}
.bin[data-lane="0"]{--cap:var(--g);--base:var(--gd)}.bin[data-lane="1"]{--cap:var(--b);--base:var(--bd)}.bin[data-lane="2"]{--cap:var(--r);--base:var(--rd)}
.bin .cap{position:absolute;inset:0 0 10px 0;border-radius:18px;background:linear-gradient(180deg,#ffffff40,#ffffff00 46%),var(--cap);border:2px solid #00000040;box-shadow:inset 0 2px 0 #ffffff70,inset 0 -6px 10px #00000026;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;transform:translateY(0);transition:transform .07s ease-out}
.bin::after{content:"";position:absolute;left:6%;right:6%;bottom:-6px;height:10px;border-radius:50%;background:#00000030;filter:blur(5px);z-index:-1}
.bin b{font:900 14px/1 ui-monospace,monospace;letter-spacing:.1em;text-shadow:0 1px 0 #00000055}
.bin span{font:800 9px/1 ui-monospace,monospace;letter-spacing:.1em;opacity:.9;padding:3px 7px;border-radius:5px;background:#00000026}
.bin.is-down .cap,.bin:active .cap{transform:translateY(8px);box-shadow:inset 0 2px 0 #ffffff30,inset 0 -2px 4px #00000040;transition-duration:.03s}
.bin.is-down{filter:brightness(1.06)}
.bin.guide .cap{animation:pulse .85s ease-in-out infinite;outline:4px solid #fff;outline-offset:3px}
.bin.guide::before{content:"PRESS";position:absolute;left:50%;top:-24px;transform:translateX(-50%);padding:4px 8px;border-radius:7px;background:var(--ink);color:#fff;font:900 9px/1 ui-monospace,monospace;letter-spacing:.12em;white-space:nowrap;animation:bob .85s ease-in-out infinite}
.bin.guide.alt::before{content:"OR THIS";background:#7a7f7a}
.bin.dim{opacity:.55}
@keyframes pulse{0%,100%{box-shadow:inset 0 2px 0 #ffffff70,inset 0 -6px 10px #00000026,0 0 0 0 #ffffffcc}50%{box-shadow:inset 0 2px 0 #ffffff70,inset 0 -6px 10px #00000026,0 0 0 12px #ffffff00}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.bin:focus-visible .cap{outline:3px solid var(--ink);outline-offset:3px}
.overlay{position:fixed;z-index:8;inset:0;display:grid;place-items:center;padding:18px;background:#242a2a45;backdrop-filter:blur(4px);overflow:auto;touch-action:pan-y}
.panel{width:min(440px,100%);padding:22px;border:2px solid #242a2a70;border-radius:17px;background:#eee8d9f7;box-shadow:0 12px 0 #242a2a18,0 25px 70px #242a2a25;text-align:center;margin:auto}
.eyebrow{font:900 8px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--olive)}
.panel h1{margin:11px 0 8px;font:900 clamp(36px,10vw,50px)/.9 Inter,sans-serif;letter-spacing:-.06em}
.panel p{margin:0 auto;color:#555c58;font-size:12px;line-height:1.55;max-width:360px}
.btns{display:grid;gap:9px;margin-top:16px}
.big{width:100%;min-height:50px;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--paper2);font:900 11px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .06s,box-shadow .06s}
.big:active{transform:translateY(5px);box-shadow:0 0 0 #000}
.big.alt{background:var(--paper2);color:var(--ink);box-shadow:0 5px 0 #242a2a66}
.big.alt:active{box-shadow:0 0 0 #242a2a66}
.big:focus-visible,.mini:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
.ref{margin:14px auto 0;display:grid;grid-template-columns:1fr;gap:6px;text-align:left}
.row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;background:#d9d1be88;font:800 10px/1.2 ui-monospace,monospace;letter-spacing:.04em}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid #242a2a80;flex:none}
.keys{margin-left:auto;display:flex;gap:4px}
.k{width:20px;height:20px;border-radius:5px;border:2px solid #00000040;display:grid;place-items:center;color:#fff;font:900 9px/1 ui-monospace,monospace}
.k.g{background:var(--g)}.k.b{background:var(--b)}.k.r{background:var(--r)}
.note{margin-top:10px;font:800 9px/1.5 ui-monospace,monospace;color:#6a706b;letter-spacing:.04em}
.hide{display:none!important}
@media(min-width:760px){.bin{min-height:78px}}
@media(max-height:700px){.bins{bottom:max(86px,calc(env(safe-area-inset-bottom) + 82px))}.bin{min-height:66px}}
@media(max-width:520px){.stat{min-width:54px}.stat b{font-size:16px}.bins{gap:9px;width:calc(100% - 16px)}.bin{min-height:76px}.bin b{font-size:12px}}
@media(orientation:landscape) and (max-height:560px){.top{margin-top:66px}.bins{bottom:78px}.bin{min-height:62px}.bin span{display:none}.hint{display:none}.bin.guide::before{top:-20px}}
@media(prefers-reduced-motion:reduce){.bin .cap,.bin.guide .cap,.bin.guide::before{animation:none;transition:none}}
</style>
</head>
<body class="dg-retro-skin" data-game="parcel-sort">
<canvas id="game" aria-label="Parcel Sort game board"></canvas>
<div class="ui">
  <div class="top" aria-live="polite">
    <div class="stat"><small>SCORE</small><b id="score">00000</b></div>
    <div class="stat"><small>ROUND</small><b id="round">01</b></div>
    <div class="stat"><small>COMBO</small><b id="combo">×1</b></div>
    <div class="stat"><small>LIVES</small><b id="lives">●●●</b></div>
  </div>
  <div class="hrow"><div id="hint" class="hint">Press Play to start</div>
  <div class="tools">
    <button id="guideBtn" class="mini" type="button" aria-pressed="true">GUIDE ON</button>
    <button id="helpBtn" class="mini" type="button">HOW TO</button>
  </div></div>
  <div class="bins" aria-label="Sorting buttons">
    <button class="bin" data-lane="0" type="button" aria-label="Green button, key A or 1"><div class="cap"><b>GREEN</b><span>A / 1</span></div></button>
    <button class="bin" data-lane="1" type="button" aria-label="Blue button, key S or 2"><div class="cap"><b>BLUE</b><span>S / 2</span></div></button>
    <button class="bin" data-lane="2" type="button" aria-label="Red button, key D or 3"><div class="cap"><b>RED</b><span>D / 3</span></div></button>
  </div>
</div>
<div id="overlay" class="overlay">
  <section class="panel" role="dialog" aria-labelledby="title">
    <div class="eyebrow">D'GAMES · SORTING DESK</div>
    <h1 id="title">Parcel Sort</h1>
    <p id="message">Match each falling parcel to its light. Single colors use one button. Mixed colors need two buttons pressed together. New here? Do the tutorial first.</p>
    <div class="btns">
      <button id="start" class="big" type="button">Play</button>
      <button id="tutBtn" class="big alt" type="button">Tutorial</button>
    </div>
    <div id="ref" class="ref hide"></div>
  </section>
</div>
<script src="/assets/dgames-ui.js"></script>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const canvas=$('game'),ctx=canvas.getContext('2d');
  const scoreEl=$('score'),roundEl=$('round'),comboEl=$('combo'),livesEl=$('lives'),hintEl=$('hint');
  const overlay=$('overlay'),start=$('start'),tutBtn=$('tutBtn'),message=$('message'),refEl=$('ref');
  const guideBtn=$('guideBtn'),helpBtn=$('helpBtn');
  const bins=[...document.querySelectorAll('.bin')];

  // bit 1 = green, 2 = blue, 4 = red
  const labels=['GREEN','BLUE','RED'];
  const keyTags=['G','B','R'];
  const mixes={
    1:{name:'GREEN',formula:'GREEN',h:132,s:62,l:46},
    2:{name:'BLUE',formula:'BLUE',h:218,s:78,l:56},
    4:{name:'RED',formula:'RED',h:5,s:76,l:56},
    3:{name:'CYAN',formula:'GREEN + BLUE',h:184,s:72,l:48},
    5:{name:'YELLOW',formula:'GREEN + RED',h:48,s:90,l:54},
    6:{name:'MAGENTA',formula:'BLUE + RED',h:310,s:66,l:56},
    7:{name:'WHITE',formula:'GREEN + BLUE + RED',h:45,s:30,l:96}
  };
  // extra shortcut: a white parcel is also cleared by the middle button alone
  function accepted(t){return t===7?[7,2]:[t]}
  function isOk(mask,t){return accepted(t).includes(mask)}
  function couldGrow(mask,t){return accepted(t).some(a=>(mask&~a)===0&&mask!==a)}
  function bitsOf(m){return [0,1,2].filter(i=>m&(1<<i))}

  let W=0,H=0,dpr=1,raf=0,last=0,running=false;
  let score=0,round=1,stage=1,combo=1,lives=3,speed=78;
  let parcel=null,particles=[],shake=0,flash=null;
  let best=Number(localStorage.getItem('parcel-sort-best')||0);
  let lastStage=1,guideOn=true,guideTouched=false;
  let heldMask=0,attemptMask=0,attemptAt=0,attemptTimer=0;
  let tut=null; // tutorial state

  /* ---------- sound + haptics ---------- */
  let ac=null;
  function tone(freq,dur,type,gain){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended')ac.resume();
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type||'square';o.frequency.value=freq;
      g.gain.setValueAtTime(gain||.05,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
  const padTone=[330,440,550];

  /* ---------- colors: pure at the start, they drift later ---------- */
  function drift(){return Math.min(1,Math.max(0,(stage-1)/4))}   // 0 at stage 1, 1 at stage 5
  function parcelHsl(p){
    const m=mixes[p.target];
    return {h:m.h+p.dh*drift(),s:Math.max(12,m.s-p.ds*drift()),l:m.l+p.dl*drift()};
  }
  function css(c,a){return 'hsl('+c.h.toFixed(0)+' '+c.s.toFixed(0)+'% '+c.l.toFixed(0)+'%'+(a!=null?' / '+a:'')+')'}
  function pureCss(t){const m=mixes[t];return 'hsl('+m.h+' '+m.s+'% '+m.l+'%)'}

  function fmt(n){return String(Math.max(0,Math.floor(n))).padStart(5,'0')}
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!running)drawBackground(0);
  }
  addEventListener('resize',resize,{passive:true});
  function beltBot(){const r=document.querySelector('.bins').getBoundingClientRect();return Math.max(160,r.top-30)}
  function beltTopY(){const r=document.querySelector('.hrow').getBoundingClientRect();return Math.max(90,r.bottom+8)}
  function laneY(){return (beltTopY()+beltBot())/2}
  function laneX(i){return W*(i+.5)/3}

  /* ---------- tutorial script ---------- */
  const TUT=[
    {t:1,say:'Single colors: one button. This parcel is GREEN, so press GREEN.'},
    {t:2,say:'BLUE parcel: press BLUE, the middle button.'},
    {t:4,say:'RED parcel: press RED.'},
    {t:3,say:'Mixed color! CYAN = GREEN + BLUE. Press both buttons together (within a blink).'},
    {t:5,say:'YELLOW = GREEN + RED. Press the two outer buttons together.'},
    {t:6,say:'MAGENTA = BLUE + RED. Press both together.'},
    {t:7,say:'WHITE = all three lights. Press all three together, OR just tap the middle button. Either works.'},
    {t:7,say:'Try WHITE the other way: press all three at once.',need:7},
    {t:1,say:'Later the colors drift and get less perfect. Trust the hue, not the label. Last try!',drifty:true}
  ];

  function setHint(html){hintEl.innerHTML=html}
  function stageHint(){
    return 'STAGE '+stage+' · '+(stage>=4?'BELT HOT · ':stage>=2?'MIX COLORS · ':'LEARN THE COLORS · ')+'3 MISSES CLOSE THE DESK';
  }
  function setHud(){
    scoreEl.textContent=fmt(score);
    roundEl.textContent=String(round).padStart(2,'0');
    comboEl.textContent='×'+combo;
    livesEl.textContent='●'.repeat(lives)+'○'.repeat(3-lives);
    if(tut)return;
    if(parcel&&guideOn){
      const m=mixes[parcel.target];
      setHint('<em>'+m.name+'</em> = '+m.formula+(parcel.target===7?' (or just BLUE)':'')+'<br>'+stageHint());
    }else setHint(stageHint());
  }

  function updateGuide(){
    bins.forEach(b=>b.classList.remove('guide','alt','dim'));
    if(!running||!parcel)return;
    const show=tut?true:guideOn;
    if(!show)return;
    const t=parcel.target;
    const need=tut&&tut.step.need?tut.step.need:t;
    if(t===7&&need===7&&tut&&tut.step.need===7){bitsOf(7).forEach(i=>bins[i].classList.add('guide'));return}
    if(t===7){bitsOf(7).forEach(i=>bins[i].classList.add('guide'));return}
    bitsOf(t).forEach(i=>bins[i].classList.add('guide'));
    [0,1,2].forEach(i=>{if(!(t&(1<<i)))bins[i].classList.add('dim')});
  }

  function setGuide(on,user){
    guideOn=on;if(user)guideTouched=true;
    guideBtn.textContent='GUIDE '+(on?'ON':'OFF');
    guideBtn.setAttribute('aria-pressed',String(on));
    updateGuide();setHud();
  }

  function newParcel(){
    let target;
    if(tut){target=tut.step.t}
    else{
      const pool=stage===1?[1,2,4]:stage===2?[1,2,4,3,5,6]:[1,2,4,3,5,6,7];
      target=pool[Math.floor(Math.random()*pool.length)];
    }
    const rush=!tut&&stage>=2&&round%5===0;
    const bonus=!tut&&round%9===0;
    parcel={
      x:tut?W/2:laneX(Math.floor(Math.random()*3)),
      y:tut?laneY()-H*.05:beltTopY()+48+(rush?(beltBot()-beltTopY())*.3:0),
      size:Math.max(30,Math.min(46,W*.09)),
      target,bonus,rush,
      dh:(Math.random()<.5?-1:1)*(10+Math.random()*16),
      ds:14+Math.random()*26,
      dl:(Math.random()<.5?-1:1)*(4+Math.random()*7),
      born:performance.now()
    };
    if(tut&&tut.step.drifty){stage=5}
    updateGuide();setHud();
  }

  function reset(){
    score=0;round=1;stage=1;lastStage=1;combo=1;lives=3;
    speed=78;particles=[];shake=0;heldMask=0;attemptMask=0;attemptAt=0;
    clearTimeout(attemptTimer);
    if(!guideTouched)setGuide(true,false);
    newParcel();setHud();
  }

  function begin(){
    overlay.style.display='none';
    running=true;
    last=performance.now();
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
  }
  function startGame(){tut=null;reset();begin();tone(660,.08,'triangle',.06)}

  function startTutorial(){
    tut={i:0,step:TUT[0],miss:0};
    score=0;round=1;stage=1;lastStage=1;combo=1;lives=3;particles=[];heldMask=0;attemptMask=0;
    clearTimeout(attemptTimer);
    begin();
    newParcel();showTutStep();
  }
  function showTutStep(){
    tut.step=TUT[tut.i];
    stage=tut.step.drifty?5:1;
    if(parcel){parcel.target=tut.step.t;parcel.born=performance.now();parcel.dh=14;parcel.ds=26;parcel.dl=-6;parcel.x=W/2}
    setHint('<em>TUTORIAL '+(tut.i+1)+'/'+TUT.length+'</em><br>'+tut.step.say);
    roundEl.textContent=String(tut.i+1).padStart(2,'0');
    updateGuide();
  }

  function showRef(){
    refEl.classList.remove('hide');
    refEl.innerHTML=[1,2,4,3,5,6,7].map(t=>{
      const m=mixes[t];
      const keys=bitsOf(t).map(i=>'<i class="k '+['g','b','r'][i]+'">'+keyTags[i]+'</i>').join('');
      const extra=t===7?'<span style="opacity:.7"> or BLUE only</span>':'';
      return '<div class="row"><span class="sw" style="background:'+pureCss(t)+'"></span>'+m.name+extra+'<span class="keys">'+keys+'</span></div>';
    }).join('')+'<div class="note">Mixed colors: press the buttons together. Keys: A S D or 1 2 3 or arrows. Colors start pure and drift as stages climb.</div>';
  }

  function endGame(){
    running=false;
    clearTimeout(attemptTimer);
    heldMask=0;attemptMask=0;
    best=Math.max(best,score);
    localStorage.setItem('parcel-sort-best',String(best));
    message.textContent='Desk closed. You scored '+score+' points. Best: '+best+'.';
    start.textContent='Sort another run';
    overlay.style.display='grid';
    updateGuide();showRef();
    tone(180,.3,'sawtooth',.05);
  }

  function burst(x,y,color,good){
    for(let i=0;i<14;i++)particles.push({x,y,vx:(Math.random()-.5)*130,vy:(Math.random()-.7)*130,a:1,c:color,s:2+Math.random()*3.5,good});
  }

  function difficulty(){
    stage=1+Math.floor((round-1)/5);
    speed=Math.min(245,78+round*3.6+(stage-1)*18);
    if(stage>lastStage){
      combo=Math.max(combo,2);
      burst(W/2,H*.42,'#242a2a',true);
      lastStage=stage;
      if(stage===3&&guideOn&&!guideTouched){setGuide(false,false);flash='GUIDE OFF · tap GUIDE to bring it back'}
      else flash='STAGE '+stage+' · colors are drifting';
      setTimeout(()=>{flash=null},2200);
    }
  }

  function loseLife(color){
    lives--;combo=1;shake=12;
    burst(parcel?.x||W/2,parcel?.y||H/2,color||'#6f746e',false);
    buzz(60);tone(140,.18,'sawtooth',.05);
    setHud();
    if(lives<=0){endGame();return true}
    return false;
  }

  function resolveAttempt(mask){
    if(!running||!parcel||!mask)return;
    clearTimeout(attemptTimer);attemptTimer=0;attemptMask=0;attemptAt=0;
    const ok=isOk(mask,parcel.target)&&(!tut||!tut.step.need||mask===tut.step.need);
    if(tut){
      if(ok){
        burst(parcel.x,parcel.y,pureCss(parcel.target),true);
        tone(880,.12,'triangle',.07);buzz([10,30,10]);
        tut.i++;
        if(tut.i>=TUT.length){
          running=false;tut=null;stage=1;
          message.textContent='Tutorial complete. You know every variation. Ready for a real run?';
          start.textContent='Play';overlay.style.display='grid';updateGuide();showRef();
          setHud();
          return;
        }
        showTutStep();
      }else{
        shake=8;buzz(40);tone(150,.12,'sawtooth',.05);
        const m=mixes[parcel.target];
        setHint('<em>Not quite.</em> '+m.name+' = '+m.formula+(parcel.target===7?' (or just BLUE)':'')+'. Look at the glowing buttons.');
      }
      return;
    }
    if(ok){
      const isMix=(parcel.target&(parcel.target-1))!==0;
      score+=(10*combo)+(parcel.bonus?25:0)+(isMix?15:0);
      combo=Math.min(9,combo+1);
      burst(parcel.x,parcel.y,parcel.bonus?'#c9a94b':pureCss(parcel.target),true);
      tone(700+combo*40,.1,'triangle',.06);
      round++;difficulty();newParcel();
    }else{
      score=Math.max(0,score-5);
      if(!loseLife('#6f746e'))newParcel();
    }
    setHud();
  }

  function press(i){
    bins[i].classList.add('is-down');
    buzz(12);tone(padTone[i],.05,'square',.04);
  }
  function release(i){bins[i].classList.remove('is-down')}

  function registerPress(i){
    if(!running||!parcel)return;
    const bit=1<<i;
    if(heldMask&bit)return;
    heldMask|=bit;
    const now=performance.now();
    if(now-attemptAt>300)attemptMask=0;
    attemptMask|=bit;attemptAt=now;
    if(isOk(attemptMask,parcel.target)&&!couldGrow(attemptMask,parcel.target)||(attemptMask&~accepted(parcel.target).reduce((a,b)=>a|b,0))!==0){
      resolveAttempt(attemptMask);
    }else{
      clearTimeout(attemptTimer);
      attemptTimer=setTimeout(()=>resolveAttempt(attemptMask),isOk(attemptMask,parcel.target)?200:300);
    }
  }
  function releasePress(i){heldMask&=~(1<<i)}

  bins.forEach((b,i)=>{
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();
      b.setPointerCapture?.(e.pointerId);
      press(i);
      registerPress(i);
    });
    const up=e=>{e.preventDefault();release(i);releasePress(i)};
    b.addEventListener('pointerup',up);
    b.addEventListener('pointercancel',()=>{release(i);releasePress(i)});
    b.addEventListener('lostpointercapture',()=>{release(i);releasePress(i)});
  });

  const KEYMAP={a:0,'1':0,arrowleft:0,s:1,'2':1,arrowdown:1,d:2,'3':2,arrowright:2};
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='enter'||k===' '){
      if(overlay.style.display!=='none'&&document.activeElement&&document.activeElement.tagName==='BUTTON')return;
      e.preventDefault();if(!running)startGame();return;
    }
    if(k in KEYMAP){
      e.preventDefault();
      if(running&&!e.repeat){press(KEYMAP[k]);registerPress(KEYMAP[k])}
    }
  },{passive:false});
  addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    if(k in KEYMAP){release(KEYMAP[k]);releasePress(KEYMAP[k])}
  });

  start.addEventListener('click',startGame);
  tutBtn.addEventListener('click',startTutorial);
  guideBtn.addEventListener('click',()=>setGuide(!guideOn,true));
  helpBtn.addEventListener('click',()=>{
    if(running){running=false;cancelAnimationFrame(raf)}
    message.textContent='Every variation. Press the colored buttons together for mixes.';
    start.textContent=tut?'Restart tutorial':'Play';
    overlay.style.display='grid';showRef();
  });

  /* ---------- drawing ---------- */
  function drawBackground(t){
    ctx.fillStyle='#d9d1be';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.12;ctx.strokeStyle='#242a2a';ctx.lineWidth=1;
    for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.globalAlpha=1;
    const beltTop=beltTopY(),beltBottom=beltBot();
    ctx.fillStyle='#c5bba6';ctx.fillRect(0,beltTop,W,beltBottom-beltTop);
    ctx.fillStyle='#9f9685';ctx.fillRect(0,beltTop,W,8);ctx.fillRect(0,beltBottom-8,W,8);
    ctx.strokeStyle='#242a2a22';ctx.lineWidth=2;
    for(let i=1;i<3;i++){const x=W*i/3;ctx.beginPath();ctx.moveTo(x,beltTop);ctx.lineTo(x,beltBottom);ctx.stroke()}
    ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#242a2a';
    const offset=(t/18)%70;
    for(let y=beltTop+offset-70;y<beltBottom;y+=70)ctx.fillRect(0,y,W,2);
    ctx.restore();
    // pure RGB lamps along the end of the belt
    const lamp=['#2fbf55','#2f72e6','#e64a3c'];
    for(let i=0;i<3;i++){
      const x=laneX(i),y=beltBottom-20;
      ctx.fillStyle='#eee8d9';ctx.strokeStyle='#242a2a66';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(x-46,y-12,92,34,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=lamp[i];ctx.beginPath();ctx.arc(x-28,y+5,6,0,7);ctx.fill();
      ctx.fillStyle='#242a2a';ctx.font='900 9px ui-monospace,monospace';ctx.textAlign='left';
      ctx.fillText(labels[i],x-17,y+8);
    }
  }

  function drawParcel(){
    if(!parcel)return;
    const p=parcel,c=parcelHsl(p),big=p.size;
    const age=Math.min(1,(performance.now()-p.born)/140);
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(Math.sin(performance.now()/500)*.03);
    ctx.scale((.85+.15*age)*1.35,(.85+.15*age)*1.35);
    ctx.shadowColor='#242a2a30';ctx.shadowBlur=8;ctx.shadowOffsetY=5;
    ctx.fillStyle='#eee8d9';ctx.strokeStyle='#242a2a';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-big/2,-big/2,big,big,6);ctx.fill();ctx.stroke();
    ctx.shadowColor='transparent';
    // big color window so the hue is the thing you read
    ctx.fillStyle=css(c);
    ctx.beginPath();ctx.roundRect(-big*.36,-big*.36,big*.72,big*.5,5);ctx.fill();
    ctx.strokeStyle='#242a2a55';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#ffffff55';ctx.fillRect(-big*.3,-big*.3,big*.6,big*.08);
    ctx.fillStyle=p.bonus?'#c9a94b':'#242a2a22';
    ctx.fillRect(-big*.5,big*.2,big,5);
    // label disappears in later stages: read the color, not the word
    if(stage<4||tut){
      ctx.fillStyle='#242a2a';
      ctx.font='900 '+Math.max(7,big*.15)+'px ui-monospace,monospace';
      ctx.textAlign='center';
      ctx.fillText(mixes[p.target].name,0,big*.4);
    }
    if(p.bonus){ctx.fillStyle='#242a2a';ctx.font='900 '+Math.max(9,big*.2)+'px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText('★',big*.36,-big*.4)}
    ctx.restore();
  }

  function drawParticles(dt){
    for(const p of particles){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.a-=dt*2.2;
      ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);
    }
    ctx.globalAlpha=1;
    particles=particles.filter(p=>p.a>0);
  }

  function loop(now){
    if(!running)return;
    const dt=Math.min(.032,Math.max(0,(now-last)/1000));
    last=now;
    if(parcel&&!tut){
      parcel.y+=speed*dt;
      if(parcel.y>beltBot()-25){
        score=Math.max(0,score-8);
        if(!loseLife('#6f746e'))newParcel();
        setHud();
      }
    }
    drawBackground(now);
    ctx.save();
    if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*28)}
    drawParcel();drawParticles(dt);
    ctx.restore();
    if(flash){
      ctx.fillStyle='#242a2aee';const w=Math.min(W-30,360);
      ctx.beginPath();ctx.roundRect(W/2-w/2,H*.3+60,w,34,9);ctx.fill();
      ctx.fillStyle='#eee8d9';ctx.font='900 10px ui-monospace,monospace';ctx.textAlign='center';
      ctx.fillText(flash,W/2,H*.3+81);
    }
    raf=requestAnimationFrame(loop);
  }

  // test hook for automated checks
  window.__ps={state:()=>({running,score,stage,lives,target:parcel&&parcel.target,tut:tut&&tut.i}),press:i=>{registerPress(i);setTimeout(()=>releasePress(i),30)}};
  setHud();resize();showRef();
})();
</script>
</body>
