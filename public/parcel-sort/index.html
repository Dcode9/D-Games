<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#d9d1be">
<title>Parcel Sort — D'Games</title>
<link rel="stylesheet" href="/assets/dgames-ui.css">
<style>
*{box-sizing:border-box}
:root{--paper:#d9d1be;--paper2:#eee8d9;--ink:#242a2a;--muted:#6f746e;--olive:#718466;--brick:#a85d49;--blue:#55758a}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
body{touch-action:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:3;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.top{margin-top:max(86px,calc(env(safe-area-inset-top) + 78px));display:flex;gap:8px;align-items:center;padding:8px 11px;border:2px solid #242a2a55;border-radius:11px;background:#eee8d9ee;box-shadow:0 4px 0 #242a2a18}
.stat{min-width:72px;text-align:center}.stat small{display:block;font:800 7px/1 ui-monospace,monospace;letter-spacing:.13em;color:var(--muted)}.stat b{display:block;margin-top:4px;font:900 18px/1 ui-monospace,monospace}
#combo{color:var(--brick)}
.hint{margin-top:9px;padding:5px 9px;border:1px solid #242a2a28;border-radius:7px;background:#eee8d9d9;color:#606762;font:800 7px/1 ui-monospace,monospace;letter-spacing:.06em}
.bins{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);width:min(620px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:9px;pointer-events:auto}
.bin{min-height:74px;border:2px solid #242a2a5a;border-radius:13px;background:#eee8d9ee;box-shadow:0 5px 0 #242a2a20;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;color:var(--ink);transition:transform .08s,background .12s}
.bin:active,.bin.is-active{transform:translateY(3px);box-shadow:0 2px 0 #242a2a20}
.bin b{font:900 12px/1 ui-monospace,monospace;letter-spacing:.06em}
.bin span{margin-top:5px;color:var(--muted);font:800 7px/1 ui-monospace,monospace}
.bin[data-lane="0"]{border-color:#71846688}.bin[data-lane="1"]{border-color:#55758a88}.bin[data-lane="2"]{border-color:#a85d4988}
.overlay{position:fixed;z-index:8;inset:0;display:grid;place-items:center;padding:22px;background:#242a2a35;backdrop-filter:blur(4px)}
.panel{width:min(420px,100%);padding:25px;border:2px solid #242a2a70;border-radius:17px;background:#eee8d9f7;box-shadow:0 12px 0 #242a2a18,0 25px 70px #242a2a25;text-align:center}
.eyebrow{font:900 8px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--olive)}
.panel h1{margin:11px 0 8px;font:900 clamp(38px,10vw,54px)/.9 Inter,sans-serif;letter-spacing:-.06em}
.panel p{margin:0 auto;color:#666d68;font-size:12px;line-height:1.55;max-width:340px}
#start{width:100%;min-height:48px;margin-top:18px;border:2px solid var(--ink);border-radius:11px;background:var(--ink);color:var(--paper2);font:900 10px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
#start:focus-visible,.bin:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
@media(min-width:760px){.bins{bottom:28px}.bin{min-height:64px}.hint{font-size:8px}}
@media(max-width:520px){.top{margin-top:max(82px,calc(env(safe-area-inset-top) + 72px));}.stat{min-width:62px}.stat b{font-size:16px}.bins{gap:6px;width:calc(100% - 16px)}.bin{min-height:68px}.bin b{font-size:10px}.bin span{font-size:6px}.hint{max-width:calc(100% - 30px);text-align:center;line-height:1.4}}
@media(orientation:landscape) and (max-height:560px){.top{margin-top:70px}.bins{bottom:10px}.bin{min-height:54px}.bin span{display:none}.hint{display:none}}
@media(prefers-reduced-motion:reduce){.bin{transition:none}}
</style>
</head>
<body class="dg-retro-skin" data-game="parcel-sort">
<canvas id="game" aria-label="Parcel Sort game board"></canvas>
<div class="ui">
  <div class="top" aria-live="polite">
    <div class="stat"><small>SCORE</small><b id="score">00000</b></div>
    <div class="stat"><small>ROUND</small><b id="round">01</b></div>
    <div class="stat"><small>COMBO</small><b id="combo">×1</b></div>
  </div>
  <div class="hint">SORT EACH PARCEL BEFORE IT REACHES THE END</div>
  <div class="bins" aria-label="Sorting bins">
    <button class="bin" data-lane="0" type="button"><b>GREEN</b><span>A / 1</span></button>
    <button class="bin" data-lane="1" type="button"><b>BLUE</b><span>S / 2</span></button>
    <button class="bin" data-lane="2" type="button"><b>RED</b><span>D / 3</span></button>
  </div>
</div>
<div id="overlay" class="overlay">
  <section class="panel" role="dialog" aria-labelledby="title">
    <div class="eyebrow">D'GAMES · SORTING DESK</div>
    <h1 id="title">Parcel Sort</h1>
    <p id="message">Packages roll down three lanes. Read the stamp, send each parcel to the matching bay, and keep your streak alive as the belt accelerates.</p>
    <button id="start" type="button">Open the desk</button>
  </section>
</div>
<script src="/assets/dgames-ui.js"></script>
<script>
(() => {
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score'),roundEl=document.getElementById('round'),comboEl=document.getElementById('combo');
  const overlay=document.getElementById('overlay'),start=document.getElementById('start'),message=document.getElementById('message');
  const bins=[...document.querySelectorAll('.bin')];
  const colors=['#718466','#55758a','#a85d49'],labels=['GREEN','BLUE','RED'];
  let W=0,H=0,dpr=1,raf=0,last=0,running=false,score=0,round=1,combo=1,lives=3,spawn=0,speed=78,parcel=null,particles=[],shake=0,best=Number(localStorage.getItem('parcel-sort-best')||0);
  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener('resize',resize,{passive:true});resize();
  function laneY(){return H*.51}
  function laneX(i){return W*(i+.5)/3}
  function fmt(n){return String(Math.max(0,n)).padStart(5,'0')}
  function setHud(){scoreEl.textContent=fmt(score);roundEl.textContent=String(round).padStart(2,'0');comboEl.textContent='×'+combo}
  function newParcel(){const lane=Math.floor(Math.random()*3);parcel={lane,x:laneX(lane),y:laneY()-H*.29,size:Math.max(24,Math.min(38,W*.075)),stamp:Math.floor(Math.random()*3),rot:(Math.random()-.5)*.15};}
  function reset(){score=0;round=1;combo=1;lives=3;spawn=.15;speed=78;particles=[];shake=0;newParcel();setHud()}
  function startGame(){overlay.style.display='none';running=true;reset();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  function endGame(){running=false;best=Math.max(best,score);localStorage.setItem('parcel-sort-best',best);message.textContent='Desk closed. You scored '+score+' points. Best: '+best+'.';start.textContent='Sort another run';overlay.style.display='grid'}
  function burst(x,y,color,good){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*110,vy:(Math.random()-.7)*110,a:1,c:color,s:2+Math.random()*3,good})}
  function choose(lane){
    if(!running||!parcel)return;
    bins[lane].classList.add('is-active');setTimeout(()=>bins[lane].classList.remove('is-active'),90);
    const correct=lane===parcel.stamp;
    if(correct){
      score+=10*combo;combo=Math.min(9,combo+1);burst(parcel.x,parcel.y,colors[parcel.stamp],true);round++;speed=Math.min(185,78+round*4);newParcel();
    }else{
      score=Math.max(0,score-5);combo=1;shake=8;burst(parcel.x,parcel.y,colors[parcel.stamp],false);newParcel();
    }
    setHud();
  }
  bins.forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();choose(i)}));
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['a','s','d','1','2','3','arrowleft','arrowdown','arrowright','enter',' '].includes(k))e.preventDefault();
    if(!running&&(k==='enter'||k===' '))startGame();
    if(running){
      const map={a:0,'1':0,arrowleft:0,s:1,'2':1,arrowdown:1,d:2,'3':2,arrowright:2};
      if(k in map)choose(map[k]);
    }
  },{passive:false});
  start.addEventListener('click',startGame);
  function drawBackground(t){
    ctx.fillStyle='#d9d1be';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.12;ctx.strokeStyle='#242a2a';ctx.lineWidth=1;
    const gap=32;
    for(let x=0;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.globalAlpha=1;
    const beltTop=H*.23,beltBottom=H*.79;
    ctx.fillStyle='#c5bba6';ctx.fillRect(0,beltTop,W,beltBottom-beltTop);
    ctx.fillStyle='#9f9685';ctx.fillRect(0,beltTop, W,8);ctx.fillRect(0,beltBottom-8,W,8);
    ctx.strokeStyle='#242a2a22';ctx.lineWidth=2;
    for(let i=1;i<3;i++){const x=W*i/3;ctx.beginPath();ctx.moveTo(x,beltTop);ctx.lineTo(x,beltBottom);ctx.stroke()}
    ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#242a2a';
    const offset=(t/18)%70;
    for(let y=beltTop+offset-70;y<beltBottom;y+=70){ctx.fillRect(0,y,W,2)}
    ctx.restore();
    for(let i=0;i<3;i++){
      const x=laneX(i),y=beltBottom-18;
      ctx.fillStyle='#eee8d9';ctx.strokeStyle='#242a2a66';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(x-46,y-12,92,34,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=colors[i];ctx.font='900 8px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(labels[i]+' BAY',x,y+9);
    }
  }
  function drawParcel(){
    if(!parcel)return;
    const p=parcel;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.shadowColor='#242a2a25';ctx.shadowBlur=8;ctx.shadowOffsetY=5;
    ctx.fillStyle='#eee8d9';ctx.strokeStyle='#242a2a';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(-p.size/2,-p.size/2,p.size,p.size,6);ctx.fill();ctx.stroke();ctx.shadowColor='transparent';
    ctx.fillStyle=colors[p.stamp];ctx.fillRect(-p.size*.5,-3,p.size,6);
    ctx.strokeStyle='#242a2a45';ctx.lineWidth=1;ctx.strokeRect(-p.size*.28,-p.size*.28,p.size*.56,p.size*.56);
    ctx.fillStyle='#242a2a';ctx.font='900 '+Math.max(8,p.size*.23)+'px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(String(p.stamp+1),0,4);
    ctx.restore();
  }
  function drawParticles(dt){
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.a-=dt*2.2;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}
    ctx.globalAlpha=1;particles=particles.filter(p=>p.a>0);
  }
  function loop(now){
    if(!running)return;
    const dt=Math.min(.032,(now-last)/1000);last=now;
    if(parcel){parcel.y+=speed*dt; if(parcel.y>H*.79-25){score=Math.max(0,score-8);combo=1;shake=10;burst(parcel.x,parcel.y,'#6f746e',false);newParcel();setHud()}}
    drawBackground(now);
    ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*28)}
    drawParcel();drawParticles(dt);ctx.restore();
    raf=requestAnimationFrame(loop);
  }
  setHud();drawBackground(0);drawParcel();
})();
</script>
</body>
</html>
