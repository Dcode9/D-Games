<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#d9d1be">
<title>Parcel Sort — D'Games</title>
<link rel="stylesheet" href="/assets/dgames-ui.css">
<style>
*{box-sizing:border-box}
:root{--paper:#d9d1be;--paper2:#eee8d9;--ink:#242a2a;--muted:#6f746e;--olive:#718466;--brick:#a85d49;--blue:#55758a}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
body{touch-action:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:3;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.top{margin-top:max(86px,calc(env(safe-area-inset-top) + 78px));display:flex;gap:8px;align-items:center;padding:8px 11px;border:2px solid #242a2a55;border-radius:11px;background:#eee8d9ee;box-shadow:0 4px 0 #242a2a18}
.stat{min-width:72px;text-align:center}.stat small{display:block;font:800 7px/1 ui-monospace,monospace;letter-spacing:.13em;color:var(--muted)}.stat b{display:block;margin-top:4px;font:900 18px/1 ui-monospace,monospace}
#combo{color:var(--brick)}
.hint{margin-top:9px;padding:5px 9px;border:1px solid #242a2a28;border-radius:7px;background:#eee8d9d9;color:#606762;font:800 7px/1 ui-monospace,monospace;letter-spacing:.06em}
.bins{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);width:min(620px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:9px;pointer-events:auto}
.bin{min-height:74px;border:2px solid #242a2a5a;border-radius:13px;background:#eee8d9ee;box-shadow:0 5px 0 #242a2a20;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;color:var(--ink);transition:transform .08s,background .12s}
.bin:active,.bin.is-active{transform:translateY(3px);box-shadow:0 2px 0 #242a2a20}
.bin b{font:900 12px/1 ui-monospace,monospace;letter-spacing:.06em}
.bin span{margin-top:5px;color:var(--muted);font:800 7px/1 ui-monospace,monospace}
.bin[data-lane="0"]{border-color:#a85d4988}.bin[data-lane="1"]{border-color:#71846688}.bin[data-lane="2"]{border-color:#55758a88}
.overlay{position:fixed;z-index:8;inset:0;display:grid;place-items:center;padding:22px;background:#242a2a35;backdrop-filter:blur(4px)}
.panel{width:min(420px,100%);padding:25px;border:2px solid #242a2a70;border-radius:17px;background:#eee8d9f7;box-shadow:0 12px 0 #242a2a18,0 25px 70px #242a2a25;text-align:center}
.eyebrow{font:900 8px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--olive)}
.panel h1{margin:11px 0 8px;font:900 clamp(38px,10vw,54px)/.9 Inter,sans-serif;letter-spacing:-.06em}
.panel p{margin:0 auto;color:#666d68;font-size:12px;line-height:1.55;max-width:340px}
#start{width:100%;min-height:48px;margin-top:18px;border:2px solid var(--ink);border-radius:11px;background:var(--ink);color:var(--paper2);font:900 10px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
#start:focus-visible,.bin:focus-visible{outline:3px solid var(--olive);outline-offset:3px}
@media(min-width:760px){.bins{bottom:28px}.bin{min-height:64px}.hint{font-size:8px}}
@media(max-width:520px){.top{margin-top:max(82px,calc(env(safe-area-inset-top) + 72px));}.stat{min-width:62px}.stat b{font-size:16px}.bins{gap:6px;width:calc(100% - 16px)}.bin{min-height:68px}.bin b{font-size:10px}.bin span{font-size:6px}.hint{max-width:calc(100% - 30px);text-align:center;line-height:1.4}}
@media(orientation:landscape) and (max-height:560px){.top{margin-top:70px}.bins{bottom:10px}.bin{min-height:54px}.bin span{display:none}.hint{display:none}}
@media(prefers-reduced-motion:reduce){.bin{transition:none}}
</style>
</head>
<body class="dg-retro-skin" data-game="parcel-sort">
<canvas id="game" aria-label="Parcel Sort game board"></canvas>
<div class="ui">
  <div class="top" aria-live="polite">
    <div class="stat"><small>SCORE</small><b id="score">00000</b></div>
    <div class="stat"><small>ROUND</small><b id="round">01</b></div>
    <div class="stat"><small>COMBO</small><b id="combo">×1</b></div>
    <div class="stat"><small>LIVES</small><b id="lives">●●●</b></div>
  </div>
  <div id="hint" class="hint">STAGE 1 · SORT EACH PARCEL BEFORE IT REACHES THE END · 3 MISSES CLOSE THE DESK</div>
  <div class="bins" aria-label="Sorting bins">
    <button class="bin" data-lane="0" type="button"><b>GREEN</b><span>A / 1</span></button>
    <button class="bin" data-lane="1" type="button"><b>BLUE</b><span>S / 2</span></button>
    <button class="bin" data-lane="2" type="button"><b>RED</b><span>D / 3</span></button>
  </div>
</div>
<div id="overlay" class="overlay">
  <section class="panel" role="dialog" aria-labelledby="title">
    <div class="eyebrow">D'GAMES · SORTING DESK</div>
    <h1 id="title">Parcel Sort</h1>
    <p id="message">Packages roll down three lanes. Learn the RGB colors first. Later, press two matching bays together to mix light — RED + GREEN = YELLOW.</p>
    <button id="start" type="button">Open the desk</button>
  </section>
</div>
<script src="/assets/dgames-ui.js"></script>
<script>
(() => {
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score');
  const roundEl=document.getElementById('round');
  const comboEl=document.getElementById('combo');
  const livesEl=document.getElementById('lives');
  const hintEl=document.getElementById('hint');
  const overlay=document.getElementById('overlay');
  const start=document.getElementById('start');
  const message=document.getElementById('message');
  const bins=[...document.querySelectorAll('.bin')];

  const colors=['#718466','#55758a','#a85d49'];
  const labels=['GREEN','BLUE','RED'];
  const mixes={
    1:{name:'GREEN',formula:'GREEN',hex:'#718466'},
    2:{name:'BLUE',formula:'BLUE',hex:'#55758a'},
    4:{name:'RED',formula:'RED',hex:'#a85d49'},
    3:{name:'CYAN',formula:'GREEN + BLUE',hex:'#49bfc0'},
    5:{name:'YELLOW',formula:'GREEN + RED',hex:'#e6c33a'},
    6:{name:'MAGENTA',formula:'BLUE + RED',hex:'#c04ca8'},
    7:{name:'WHITE',formula:'GREEN + BLUE + RED',hex:'#f3f0e4'}
  };

  let W=0,H=0,dpr=1,raf=0,last=0,running=false;
  let score=0,round=1,stage=1,combo=1,lives=3,speed=78;
  let parcel=null,particles=[],shake=0;
  let best=Number(localStorage.getItem('parcel-sort-best')||0);
  let lastStage=1;
  let heldMask=0,attemptMask=0,attemptAt=0,attemptTimer=0;

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize,{passive:true});
  resize();

  function laneY(){return H*.51}
  function laneX(i){return W*(i+.5)/3}
  function fmt(n){return String(Math.max(0,Math.floor(n))).padStart(5,'0')}
  function setHud(){
    scoreEl.textContent=fmt(score);
    roundEl.textContent=String(round).padStart(2,'0');
    comboEl.textContent='×'+combo;
    livesEl.textContent='●'.repeat(lives)+'○'.repeat(3-lives);
    hintEl.textContent='STAGE '+stage+' · '+(stage>=4?'BELT HOT · ':stage>=2?'MIX COLORS · ':'LEARN THE COLORS · ')+'3 MISSES CLOSE THE DESK';
  }

  function targetPool(){
    if(stage===1)return [1,2,4];
    if(stage===2)return [1,2,4,3,5,6];
    return [1,2,4,3,5,6,7];
  }
  function randomTarget(){
    const pool=targetPool();
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function targetColor(mask){
    return mixes[mask]?.hex||'#eee8d9';
  }
  function newParcel(){
    const target=randomTarget();
    const rush=stage>=2&&round%5===0;
    const bonus=round%9===0;
    parcel={
      x:laneX(Math.floor(Math.random()*3)),
      y:laneY()-(rush?H*.16:H*.29),
      size:Math.max(24,Math.min(38,W*.075)),
      target,
      bonus,
      rush
    };
  }

  function reset(){
    score=0; round=1; stage=1; lastStage=1; combo=1; lives=3;
    speed=78; particles=[]; shake=0; heldMask=0; attemptMask=0; attemptAt=0;
    clearTimeout(attemptTimer);
    newParcel(); setHud();
  }

  function startGame(){
    overlay.style.display='none';
    running=true;
    reset();
    last=performance.now();
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;
    clearTimeout(attemptTimer);
    heldMask=0; attemptMask=0;
    best=Math.max(best,score);
    localStorage.setItem('parcel-sort-best',String(best));
    message.textContent='Desk closed. You scored '+score+' points. Best: '+best+'.';
    start.textContent='Sort another run';
    overlay.style.display='grid';
  }

  function burst(x,y,color,good){
    for(let i=0;i<12;i++){
      particles.push({
        x,y,
        vx:(Math.random()-.5)*110,
        vy:(Math.random()-.7)*110,
        a:1,
        c:color,
        s:2+Math.random()*3,
        good
      });
    }
  }

  function difficulty(){
    const nextStage=1+Math.floor((round-1)/5);
    stage=nextStage;
    const stagePressure=(stage-1)*18;
    speed=Math.min(245,78+round*3.6+stagePressure);
    if(stage>lastStage){
      combo=Math.max(combo,2);
      burst(W/2,H*.42,'#242a2a',true);
      lastStage=stage;
    }
  }

  function loseLife(color){
    lives--;
    combo=1;
    shake=12;
    burst(parcel?.x||W/2,parcel?.y||H/2,color||'#6f746e',false);
    setHud();
    if(lives<=0){endGame();return true}
    return false;
  }

  function resolveAttempt(mask){
    if(!running||!parcel||!mask)return;
    clearTimeout(attemptTimer);
    attemptTimer=0;
    attemptMask=0;
    attemptAt=0;

    if(mask===parcel.target){
      const isMix=(mask&(mask-1))!==0;
      const points=(10*combo)+(parcel.bonus?25:0)+(isMix?15:0);
      score+=points;
      combo=Math.min(9,combo+1);
      burst(parcel.x,parcel.y,parcel.bonus?'#c9a94b':targetColor(mask),true);
      round++;
      difficulty();
      newParcel();
    }else{
      score=Math.max(0,score-5);
      if(!loseLife('#6f746e'))newParcel();
    }
    setHud();
  }

  function registerPress(i){
    if(!running||!parcel)return;
    const bit=1<<i;
    if(heldMask&bit)return;
    heldMask|=bit;
    bins[i].classList.add('is-active');
    setTimeout(()=>bins[i].classList.remove('is-active'),90);

    const now=performance.now();
    if(now-attemptAt>260){
      attemptMask=0;
    }
    attemptMask|=bit;
    attemptAt=now;

    if(attemptMask===parcel.target || (attemptMask & ~parcel.target)!==0){
      resolveAttempt(attemptMask);
    }else{
      clearTimeout(attemptTimer);
      attemptTimer=setTimeout(()=>resolveAttempt(attemptMask),220);
    }
  }

  function releasePress(i){
    heldMask&=~(1<<i);
  }

  bins.forEach((b,i)=>{
    b.addEventListener('pointerdown',e=>{
      e.preventDefault();
      b.setPointerCapture?.(e.pointerId);
      registerPress(i);
    });
    b.addEventListener('pointerup',e=>{
      e.preventDefault();
      releasePress(i);
    });
    b.addEventListener('pointercancel',()=>releasePress(i));
    b.addEventListener('pointerleave',e=>{
      if(e.buttons===0)releasePress(i);
    });
  });

  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    const map={a:0,'1':0,arrowleft:0,s:1,'2':1,arrowdown:1,d:2,'3':2,arrowright:2};
    if(k==='enter'||k===' '){
      e.preventDefault();
      if(!running)startGame();
      return;
    }
    if(k in map){
      e.preventDefault();
      if(running&&!e.repeat)registerPress(map[k]);
    }
  },{passive:false});

  addEventListener('keyup',e=>{
    const k=e.key.toLowerCase();
    const map={a:0,'1':0,arrowleft:0,s:1,'2':1,arrowdown:1,d:2,'3':2,arrowright:2};
    if(k in map)releasePress(map[k]);
  });

  start.addEventListener('click',startGame);

  function drawBackground(t){
    ctx.fillStyle='#d9d1be';
    ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.12;
    ctx.strokeStyle='#242a2a';
    ctx.lineWidth=1;
    const gap=32;
    for(let x=0;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    ctx.globalAlpha=1;

    const beltTop=H*.23,beltBottom=H*.79;
    ctx.fillStyle='#c5bba6';
    ctx.fillRect(0,beltTop,W,beltBottom-beltTop);
    ctx.fillStyle='#9f9685';
    ctx.fillRect(0,beltTop,W,8);
    ctx.fillRect(0,beltBottom-8,W,8);

    ctx.strokeStyle='#242a2a22';
    ctx.lineWidth=2;
    for(let i=1;i<3;i++){
      const x=W*i/3;
      ctx.beginPath();ctx.moveTo(x,beltTop);ctx.lineTo(x,beltBottom);ctx.stroke();
    }

    ctx.save();
    ctx.globalAlpha=.18;
    ctx.fillStyle='#242a2a';
    const offset=(t/18)%70;
    for(let y=beltTop+offset-70;y<beltBottom;y+=70)ctx.fillRect(0,y,W,2);
    ctx.restore();

    for(let i=0;i<3;i++){
      const x=laneX(i),y=beltBottom-18;
      ctx.fillStyle='#eee8d9';
      ctx.strokeStyle='#242a2a66';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(x-46,y-12,92,34,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=colors[i];
      ctx.font='900 8px ui-monospace,monospace';
      ctx.textAlign='center';
      ctx.fillText(labels[i]+' BAY',x,y+9);
    }
  }

  function drawParcel(){
    if(!parcel)return;
    const p=parcel;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(Math.sin(performance.now()/500)*.03);
    ctx.shadowColor='#242a2a25';
    ctx.shadowBlur=8;
    ctx.shadowOffsetY=5;
    ctx.fillStyle='#eee8d9';
    ctx.strokeStyle='#242a2a';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(-p.size/2,-p.size/2,p.size,p.size,6);
    ctx.fill();ctx.stroke();
    ctx.shadowColor='transparent';

    ctx.fillStyle=p.bonus?'#c9a94b':targetColor(p.target);
    ctx.fillRect(-p.size*.5,-3,p.size,6);

    ctx.fillStyle=targetColor(p.target);
    ctx.beginPath();
    ctx.arc(0,-p.size*.08,p.size*.2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle='#242a2a';
    ctx.font='900 '+Math.max(7,p.size*.14)+'px ui-monospace,monospace';
    ctx.textAlign='center';
    ctx.fillText(mixes[p.target].name,0,p.size*.28);

    if(p.bonus){
      ctx.font='900 '+Math.max(7,p.size*.17)+'px ui-monospace,monospace';
      ctx.fillText('★',0,-p.size*.29);
    }
    ctx.restore();
  }

  function drawParticles(dt){
    for(const p of particles){
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      p.vy+=80*dt;
      p.a-=dt*2.2;
      ctx.globalAlpha=Math.max(0,p.a);
      ctx.fillStyle=p.c;
      ctx.fillRect(p.x,p.y,p.s,p.s);
    }
    ctx.globalAlpha=1;
    particles=particles.filter(p=>p.a>0);
  }

  function loop(now){
    if(!running)return;
    const dt=Math.min(.032,Math.max(0,(now-last)/1000));
    last=now;

    if(parcel){
      parcel.y+=speed*dt;
      if(parcel.y>H*.79-25){
        score=Math.max(0,score-8);
        if(!loseLife('#6f746e'))newParcel();
        setHud();
      }
    }

    drawBackground(now);
    ctx.save();
    if(shake>0){
      ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
      shake=Math.max(0,shake-dt*28);
    }
    drawParcel();
    drawParticles(dt);
    ctx.restore();

    raf=requestAnimationFrame(loop);
  }

  setHud();
  drawBackground(0);
})();
</script>
</body>
</html>
