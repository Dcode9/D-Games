<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit Guard — D'Games</title>
<link rel="stylesheet" href="/assets/dgames-ui.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071016}body{touch-action:none;font-family:Inter,system-ui,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:50%;top:88px;z-index:4;transform:translateX(-50%);padding:9px 12px;border:1px solid rgba(242,238,224,.22);border-radius:10px;background:rgba(8,16,20,.76);backdrop-filter:blur(9px);color:#f4efe2;text-align:center}.hud b{display:block;font:900 17px/1 Space Grotesk,sans-serif}.hud span{font:800 7px/1 JetBrains Mono,monospace;letter-spacing:.13em;color:#9aa4a0}.hud .hint{display:block;margin-top:6px;color:#9aa4a0;font:800 6px/1 JetBrains Mono,monospace;letter-spacing:.08em}.bar{display:flex;gap:8px;justify-content:center;margin-top:8px}.bar i{width:34px;height:4px;border-radius:999px;background:#314149}.bar i.on{background:#83a36f}.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:rgba(3,9,12,.82);backdrop-filter:blur(8px)}.panel{width:min(420px,100%);padding:24px;border:2px solid rgba(242,238,224,.54);border-radius:16px;background:rgba(19,29,33,.95);color:#f4efe2;box-shadow:0 14px 40px rgba(0,0,0,.34)}.code{font:800 8px/1 JetBrains Mono,monospace;letter-spacing:.16em;color:#83a36f;text-transform:uppercase}.panel h1{margin:10px 0 7px;font:900 42px/.9 Space Grotesk,sans-serif;letter-spacing:-.05em}.panel p{margin:0;color:#a8b1ad;font:700 10px/1.65 Inter,sans-serif}.panel button{width:100%;min-height:46px;margin-top:17px;border:2px solid #f4efe2;border-radius:10px;background:#f4efe2;color:#202729;font:900 9px/1 JetBrains Mono,monospace;letter-spacing:.08em;text-transform:uppercase}.hidden{display:none!important}
</style>
<link rel="stylesheet" href="/assets/dgames-mobile.css">
</head>
<body class="dg-retro-skin" data-game="orbit">
<canvas id="c" aria-label="Orbit Guard game"></canvas><div class="hud"><b id="score">0</b><span>CORE INTEGRITY</span><div class="hint">DRAG / MOVE TO AIM THE SHIELD</div><div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
<div id="start" class="overlay"><div class="panel"><div class="code">DG-07 · Defense / Orbit</div><h1>ORBIT GUARD</h1><p>Rotate the shield around the core. Track incoming meteors with touch, mouse, or a trackpad and catch them on the arc before they reach the center.</p><button id="startBtn" type="button">Protect the Core</button></div></div>
<div id="over" class="overlay hidden"><div class="panel"><div class="code">CORE LOST</div><h1>BREACH</h1><p id="result">Score 0</p><button id="againBtn" type="button">Rebuild Defense</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),bar=[...document.querySelectorAll('.bar i')];let W=innerWidth,H=innerHeight,dpr=1,angle=-Math.PI/2,running=false,score=0,health=100,meteors=[],parts=[],last=performance.now(),raf=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function aim(x,y){angle=Math.atan2(y-H/2,x-W/2)}c.addEventListener('pointermove',e=>{if(running)aim(e.clientX,e.clientY)});c.addEventListener('pointerdown',e=>{if(running)aim(e.clientX,e.clientY)});window.addEventListener('keydown',e=>{if(!running)return;const step=.12;if(e.key==='ArrowLeft'||e.key==='a')angle-=step;if(e.key==='ArrowRight'||e.key==='d')angle+=step});
class Meteor{constructor(){const a=Math.random()*Math.PI*2,d=Math.max(W,H)*.62+40;this.x=W/2+Math.cos(a)*d;this.y=H/2+Math.sin(a)*d;this.vx=-Math.cos(a)*(1.2+Math.random()*1.5);this.vy=-Math.sin(a)*(1.2+Math.random()*1.5);this.r=5+Math.random()*8;this.color=['#ffd36b','#ff9f72','#e86b6b'][Math.floor(Math.random()*3)]}update(){this.x+=this.vx;this.y+=this.vy}draw(){ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill()}}
class Particle{constructor(x,y,color){this.x=x;this.y=y;this.vx=(Math.random()-.5)*5;this.vy=(Math.random()-.5)*5;this.life=1;this.color=color}update(){this.x+=this.vx;this.y+=this.vy;this.life-=.045}draw(){ctx.globalAlpha=Math.max(0,this.life);ctx.fillStyle=this.color;ctx.fillRect(this.x,this.y,3,3);ctx.globalAlpha=1}}
function reset(){running=true;score=0;health=100;meteors=[];parts=[];document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');updateBar()}
function updateBar(){bar.forEach((b,i)=>b.classList.toggle('on',health>i*20));document.getElementById('score').textContent=Math.floor(score)}
function end(){running=false;document.getElementById('result').textContent='Score '+Math.floor(score)+' · '+health+'% integrity';document.getElementById('over').classList.remove('hidden')}
function spawn(){if(Math.random()<.014+score/120000)meteors.push(new Meteor())}
function frame(t){const dt=Math.min(.04,(t-last)/16.67);last=t;ctx.fillStyle='rgba(7,16,22,.38)';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(122,162,145,.12)';ctx.lineWidth=1;for(let r=120;r<Math.min(W,H);r+=70){ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke()}const core=46;ctx.fillStyle='rgba(103,213,180,.18)';ctx.beginPath();ctx.arc(W/2,H/2,core+15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#65d6ba';ctx.shadowBlur=20;ctx.shadowColor='#65d6ba';ctx.beginPath();ctx.arc(W/2,H/2,core,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(angle);ctx.strokeStyle='#f2efe0';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,106,-.42,.42);ctx.stroke();ctx.restore();if(running){score+=dt;spawn();for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.update();m.draw();const dx=m.x-W/2,dy=m.y-H/2,dist=Math.hypot(dx,dy);if(dist<112&&dist>91){let d=Math.atan2(dy,dx)-angle;while(d<-Math.PI)d+=Math.PI*2;while(d>Math.PI)d-=Math.PI*2;if(Math.abs(d)<.55){parts.push(...Array.from({length:8},()=>new Particle(m.x,m.y,'#65d6ba')));meteors.splice(i,1);score+=10;continue}}if(dist<core){parts.push(...Array.from({length:12},()=>new Particle(m.x,m.y,'#f06f62')));meteors.splice(i,1);health-=20;updateBar();if(health<=0){end();break}}}}for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.update();p.draw();if(p.life<=0)parts.splice(i,1)}updateBar();raf=requestAnimationFrame(frame)}
function start(){reset();const start=document.getElementById('start');start.classList.add('hidden');start.style.display='none';start.setAttribute('aria-hidden','true');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
window.addEventListener('pointerdown',()=>{const start=document.getElementById('start');if(!running&&!start.classList.contains('hidden'))start()},{capture:true});
window.addEventListener('keydown',e=>{const start=document.getElementById('start');if(!running&&!start.classList.contains('hidden')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();start()}},{capture:true});document.getElementById('startBtn').addEventListener('click',start);document.getElementById('againBtn').addEventListener('click',start);raf=requestAnimationFrame(frame);
</script>
<script src="/assets/dgames-ui.js" defer></script>
</body>
</html>
