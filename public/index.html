<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D'Games — Instant Play</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a0f;
  --surface: rgba(18, 20, 28, 0.75);
  --surface-hover: rgba(26, 29, 40, 0.9);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.2);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background-color: var(--bg);
  color: #f4f4f5;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

.font-display {
  font-family: 'Space Grotesk', sans-serif;
}

/* Scrollbars */
.scroll::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
.scroll::-webkit-scrollbar-track {
  background: transparent;
}
.scroll::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 999px;
}
.scroll::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.24);
}

/* Glass Panels */
.glass {
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
}

/* Navigation */
.nav-item {
  color: #a1a1aa;
  transition: all 0.15s ease;
}
.nav-item:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.05);
}
.nav-item.active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
  font-weight: 600;
}

/* Game Cards */
.game-card {
  background: var(--surface);
  border: 1px solid var(--border);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-hover);
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
}
.game-card img {
  transition: transform 0.3s ease;
}
.game-card:hover img {
  transform: scale(1.03);
}

/* Mobile Nav */
.bottom-nav {
  display: none;
}
@media (max-width: 768px) {
  .desktop-sidebar {
    display: none !important;
  }
  .bottom-nav {
    display: flex;
  }
  .main-wrapper {
    padding: 0 !important;
  }
  .content-header {
    border-radius: 0 !important;
  }
  .page-container {
    padding: 12px 12px 84px !important;
  }
}
</style>
</head>
<body class="h-screen w-screen p-2 sm:p-3 md:p-4 flex flex-col">

<div class="relative flex h-full w-full gap-3 md:gap-4 main-wrapper">
  
  <!-- ======================================================================= -->
  <!-- 1. DESKTOP SIDEBAR                                                      -->
  <!-- ======================================================================= -->
  <aside id="sidebar" class="desktop-sidebar glass rounded-2xl sm:rounded-3xl p-4 sm:p-5 flex-shrink-0 flex flex-col w-64 transition-all duration-300">
    
    <!-- Logo & Portal Link -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/5">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center font-bold text-sm text-white">
          D
        </div>
        <div>
          <h1 class="font-display text-lg font-bold tracking-tight text-white leading-none">D&apos;Games</h1>
          <a href="https://d-verse.in" target="_blank" class="text-[11px] text-zinc-500 hover:text-zinc-400 transition-colors">D&apos;Verse Portal ↗</a>
        </div>
      </div>
      <button id="btn-collapse" class="w-8 h-8 rounded-lg hover:bg-white/5 text-zinc-400 hover:text-white flex items-center justify-center text-sm" aria-label="Toggle sidebar">
        ☰
      </button>
    </div>

    <!-- Main Navigation Links -->
    <nav class="space-y-1 mb-6">
      <button class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm" data-view="home">
        <span class="text-base">⌂</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm" data-view="all-games">
        <span class="text-base">▶</span>
        <span class="nav-label">Instant Plays</span>
      </button>
      <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm" data-view="upcoming">
        <span class="text-base">◷</span>
        <span class="nav-label">Upcoming</span>
      </button>
    </nav>

    <!-- Category Filters -->
    <div class="sidebar-categories pt-2 mb-auto">
      <p class="nav-label text-[11px] font-semibold text-zinc-500 uppercase tracking-wider px-3 mb-2">Categories</p>
      <div class="space-y-0.5">
        <button class="cat-filter active w-full text-left px-3 py-1.5 rounded-lg text-xs text-zinc-300 hover:bg-white/5 font-medium flex items-center justify-between" data-cat="all">
          <span class="nav-label">All Genres</span>
          <span class="text-[10px] text-zinc-500 font-mono">10</span>
        </button>
        <button class="cat-filter w-full text-left px-3 py-1.5 rounded-lg text-xs text-zinc-400 hover:bg-white/5 hover:text-white flex items-center justify-between" data-cat="arcade">
          <span class="nav-label">Arcade</span>
        </button>
        <button class="cat-filter w-full text-left px-3 py-1.5 rounded-lg text-xs text-zinc-400 hover:bg-white/5 hover:text-white flex items-center justify-between" data-cat="puzzle">
          <span class="nav-label">Puzzle</span>
        </button>
        <button class="cat-filter w-full text-left px-3 py-1.5 rounded-lg text-xs text-zinc-400 hover:bg-white/5 hover:text-white flex items-center justify-between" data-cat="action">
          <span class="nav-label">Action</span>
        </button>
        <button class="cat-filter w-full text-left px-3 py-1.5 rounded-lg text-xs text-zinc-400 hover:bg-white/5 hover:text-white flex items-center justify-between" data-cat="classic">
          <span class="nav-label">Classic</span>
        </button>
      </div>
    </div>

    <!-- User Authentication Section -->
    <div class="pt-4 border-t border-white/5 mt-auto">
      <div id="auth-error" class="hidden text-xs text-red-400 bg-red-500/10 rounded-xl p-2.5 mb-2"></div>
      
      <div id="user-profile" class="hidden">
        <div class="flex items-center gap-3 p-2 rounded-xl bg-white/5 mb-2">
          <img id="user-avatar" class="w-8 h-8 rounded-full border border-white/10" src="https://placehold.co/40x40/27272a/ffffff?text=U" alt="User">
          <div class="nav-label min-w-0 flex-1">
            <div id="user-name" class="font-medium text-xs text-white truncate">Player</div>
            <div id="user-credits" class="text-[11px] text-zinc-400 font-mono">0 Credits</div>
          </div>
        </div>
        <button id="btn-signout" class="w-full py-2 px-3 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-zinc-400 hover:text-zinc-200 transition-colors">
          <span class="nav-label">Sign Out</span>
        </button>
      </div>

      <button id="btn-signin" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-white/10 hover:bg-white/15 text-xs text-white font-medium transition-colors">
        <span>Sign In</span>
      </button>
    </div>

  </aside>

  <!-- ======================================================================= -->
  <!-- 2. MAIN CONTENT AREA                                                    -->
  <!-- ======================================================================= -->
  <main class="flex-1 min-w-0 flex flex-col h-full overflow-hidden">
    
    <!-- Top Header Bar -->
    <header class="glass content-header rounded-2xl p-3 sm:p-4 mb-2 sm:mb-3 flex items-center justify-between gap-3 flex-shrink-0">
      <div class="flex items-center gap-3">
        <h2 id="page-title" class="font-display text-lg sm:text-xl font-bold text-white">Home</h2>
        <span id="title-tag" class="text-xs text-zinc-500 hidden sm:inline">Instant Play</span>
      </div>

      <!-- Quick Search Bar -->
      <div class="flex items-center gap-2 w-full max-w-xs sm:max-w-sm">
        <div class="relative w-full">
          <svg class="w-3.5 h-3.5 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="search-box" type="text" placeholder="Search games..." class="w-full pl-8 pr-3 py-1.5 rounded-xl text-xs bg-zinc-900/60 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-white/30 transition-colors">
        </div>
      </div>
    </header>

    <!-- Scrollable View Content -->
    <div id="content-scroll" class="scroll flex-1 overflow-y-auto page-container px-1 pb-6 space-y-6">

      <!-- VIEW: HOME -->
      <section id="view-home" class="view-panel space-y-6">
        
        <!-- Featured Game Banner -->
        <div>
          <p class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider mb-2">Featured Game</p>
          <div id="featured-container"></div>
        </div>

        <!-- Games Grid Preview -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <p class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider">All Titles</p>
            <button class="text-xs text-zinc-400 hover:text-white transition-colors" onclick="switchView('all-games')">Browse all &rarr;</button>
          </div>
          <div id="home-games-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4"></div>
        </div>

      </section>

      <!-- VIEW: ALL GAMES (INSTANT PLAYS) -->
      <section id="view-all-games" class="view-panel hidden space-y-4">
        <div class="flex items-center justify-between">
          <p class="text-xs text-zinc-400">Click on any game card to launch immediately.</p>
          <div class="flex items-center gap-1.5 text-xs">
            <span class="text-zinc-500">Showing:</span>
            <span id="active-cat-name" class="text-zinc-300 font-medium">All</span>
          </div>
        </div>
        <div id="all-games-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4"></div>
      </section>

      <!-- VIEW: UPCOMING -->
      <section id="view-upcoming" class="view-panel hidden space-y-4">
        <p class="text-xs text-zinc-400">Upcoming games currently in development or testing.</p>
        <div id="upcoming-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>

    </div>
  </main>
</div>

<!-- ======================================================================= -->
<!-- 3. MOBILE BOTTOM NAVIGATION                                             -->
<!-- ======================================================================= -->
<nav class="bottom-nav fixed bottom-0 left-0 right-0 z-40 glass border-t border-white/10 px-4 py-2 justify-around items-center h-16">
  <button class="nav-item active flex flex-col items-center gap-1 text-xs py-1 px-4 rounded-xl" data-view="home">
    <span class="text-base leading-none">⌂</span>
    <span>Home</span>
  </button>
  <button class="nav-item flex flex-col items-center gap-1 text-xs py-1 px-4 rounded-xl" data-view="all-games">
    <span class="text-base leading-none">▶</span>
    <span>Plays</span>
  </button>
  <button class="nav-item flex flex-col items-center gap-1 text-xs py-1 px-4 rounded-xl" data-view="upcoming">
    <span class="text-base leading-none">◷</span>
    <span>Upcoming</span>
  </button>
</nav>

<!-- ======================================================================= -->
<!-- 4. CLEAN FULLSCREEN GAME PLAYER MODAL                                    -->
<!-- ======================================================================= -->
<div id="game-modal" class="fixed inset-0 z-50 bg-black/95 hidden flex flex-col">
  <!-- Modal Bar -->
  <div class="h-14 px-4 border-b border-white/10 bg-zinc-950 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
      <button id="modal-close" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium text-white flex items-center gap-1.5 transition-colors">
        <span>&larr; Back</span>
      </button>
      <div class="h-4 w-[1px] bg-white/10"></div>
      <div>
        <h3 id="modal-title" class="font-display font-bold text-sm text-white leading-none">Game Title</h3>
        <p id="modal-genre" class="text-[11px] text-zinc-400 leading-none mt-0.5">Genre</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="modal-reload" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-zinc-300 hover:text-white transition-colors">
        Restart
      </button>
      <button id="modal-popout" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-zinc-300 hover:text-white transition-colors">
        Open in Tab ↗
      </button>
      <button id="modal-fullscreen" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-zinc-300 hover:text-white transition-colors">
        Fullscreen
      </button>
    </div>
  </div>

  <!-- Player Frame -->
  <div class="flex-1 bg-black relative">
    <iframe id="game-iframe" class="w-full h-full border-0" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </div>
</div>

<!-- ======================================================================= -->
<!-- 5. APPLICATION DATA & LOGIC                                             -->
<!-- ======================================================================= -->
<script>
const GAMES = [
  {
    id: 'echo-drift',
    title: 'Echo Drift',
    category: 'arcade',
    genre: 'Arcade · High-Speed',
    tag: 'FEATURED',
    desc: 'Fast-paced orbital drift mechanics. Collect harmonics and dodge pulse fields.',
    img: 'assets/echo-drift-cover.svg',
    url: '/echo-drift/'
  },
  {
    id: 'neon-tetris',
    title: 'Neon Tetris',
    category: 'puzzle',
    genre: 'Classic · Puzzle',
    tag: 'POPULAR',
    desc: 'Classic falling block puzzle with high-contrast glowing neon aesthetic.',
    img: 'assets/neon-tetris-poster.jpg',
    url: '/neon-tetris/'
  },
  {
    id: 'neon-breakout',
    title: 'Neon Breakout',
    category: 'arcade',
    genre: 'Classic · Arcade',
    tag: 'NEW',
    desc: 'Paddle brick-breaker with fast laser bounces and multiball powerups.',
    img: 'assets/neon-breakout-poster.jpg',
    url: '/neon-breakout/'
  },
  {
    id: 'cyber-road',
    title: 'Cyber Road',
    category: 'action',
    genre: 'Racing · 3D Synth',
    tag: '',
    desc: 'High-speed retro wireframe highway driving under a sunset horizon.',
    img: 'assets/cyber-cover.svg',
    url: '/cyber-road/'
  },
  {
    id: 'neon-galaxy',
    title: 'Neon Galaxy',
    category: 'action',
    genre: 'Arcade · Shooter',
    tag: '',
    desc: 'Top-down arcade space shooter battling alien waves and asteroids.',
    img: 'assets/neon-galaxy-poster.jpg',
    url: '/neon-galaxy/'
  },
  {
    id: 'tower-of-hue',
    title: 'Tower of Hue',
    category: 'puzzle',
    genre: 'Puzzle · Physics',
    tag: '',
    desc: 'Balance and stack color blocks to complete chromatic combinations.',
    img: 'assets/tower-cover.png',
    url: '/tower-of-hue/'
  },
  {
    id: 'orbit-guard',
    title: 'Orbit Guard',
    category: 'action',
    genre: 'Action · Defense',
    tag: '',
    desc: 'Defend your orbital planetary satellites from incoming hostile drones.',
    img: 'assets/orbit-cover.svg',
    url: '/orbit-guard/'
  },
  {
    id: 'ripple-reaction',
    title: 'Ripple Reaction',
    category: 'puzzle',
    genre: 'Casual · Chain Reaction',
    tag: '',
    desc: 'Trigger single node chain reactions to clear expanding ripple waves.',
    img: 'assets/ripple-cover.svg',
    url: '/ripple-reaction/'
  },
  {
    id: 'snake',
    title: 'Neon Snake',
    category: 'classic',
    genre: 'Classic · Arcade',
    tag: '',
    desc: 'The classic grid snake game with speed challenges and smooth controls.',
    img: 'assets/neon-snake-poster.jpg',
    url: '/snake/'
  },
  {
    id: '3xo',
    title: '3XO',
    category: 'classic',
    genre: 'Strategy · 2-Player',
    tag: '',
    desc: 'Competitive tic-tac-toe combat on an interactive neon game grid.',
    img: 'assets/3XO Cover.png',
    url: '/3xo.html'
  }
];

const UPCOMING = [
  {
    id: 'uncharted',
    title: 'Uncharted: Legacy of Thieves',
    genre: 'Naughty Dog · Action',
    status: 'Testing',
    desc: 'Cloud streaming preview for portal users.',
    img: 'https://image.api.playstation.com/vulcan/ap/rnd/202109/0222/a003s0V10vmLo1a025V01AvR.png'
  },
  {
    id: 'mini-metro',
    title: 'Mini Metro',
    genre: 'Tactical · Sim',
    status: 'In Development',
    desc: 'Subway layout network management simulator.',
    img: 'assets/cyber-cover.svg'
  },
  {
    id: 'rise-up',
    title: 'Rise Up',
    genre: 'Arcade · Reflex',
    status: 'In Development',
    desc: 'Deflect falling obstacles to protect your shield balloon.',
    img: 'assets/ripple-cover.svg'
  }
];

let currentCategory = 'all';
let currentSearch = '';
let currentModalUrl = '';

// --- RENDERING ---
function createCard(game) {
  return `
    <article class="game-card rounded-xl overflow-hidden cursor-pointer flex flex-col" onclick="launchGame('${game.id}')">
      <div class="relative aspect-[16/10] overflow-hidden bg-zinc-950">
        <img src="${game.img}" alt="${game.title}" loading="lazy" class="w-full h-full object-cover">
        ${game.tag ? `<span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold bg-black/70 text-white backdrop-blur border border-white/10">${game.tag}</span>` : ''}
        <div class="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 transition-opacity flex items-center justify-center">
          <span class="px-3 py-1.5 rounded-lg bg-white text-black font-semibold text-xs shadow-lg">Play</span>
        </div>
      </div>
      <div class="p-3 flex flex-col justify-between flex-1 gap-1">
        <div>
          <p class="text-[10px] text-zinc-400 truncate">${game.genre}</p>
          <h4 class="font-display font-semibold text-sm text-white truncate">${game.title}</h4>
        </div>
      </div>
    </article>
  `;
}

function renderFeatured() {
  const g = GAMES[0];
  document.getElementById('featured-container').innerHTML = `
    <article class="game-card rounded-2xl overflow-hidden p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
      <div class="aspect-[16/10] rounded-xl overflow-hidden bg-zinc-950 cursor-pointer" onclick="launchGame('${g.id}')">
        <img src="${g.img}" alt="${g.title}" class="w-full h-full object-cover">
      </div>
      <div class="flex flex-col justify-center space-y-3">
        <div>
          <span class="text-[10px] font-semibold tracking-wider text-cyan-400 uppercase">Featured Title</span>
          <h3 class="font-display text-2xl font-bold text-white mt-1">${g.title}</h3>
          <p class="text-xs text-zinc-400 mt-1 leading-relaxed">${g.desc}</p>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <button onclick="launchGame('${g.id}')" class="px-4 py-2 rounded-xl bg-white text-black font-semibold text-xs hover:bg-zinc-200 transition-colors">
            Play Now
          </button>
          <a href="${g.url}" target="_blank" class="px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs text-zinc-300 transition-colors">
            New Window ↗
          </a>
        </div>
      </div>
    </article>
  `;
}

function renderGames() {
  const filtered = GAMES.filter(g => {
    const matchCat = currentCategory === 'all' || g.category === currentCategory;
    const matchSearch = !currentSearch ||
      g.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
      g.desc.toLowerCase().includes(currentSearch.toLowerCase()) ||
      g.genre.toLowerCase().includes(currentSearch.toLowerCase());
    return matchCat && matchSearch;
  });

  const cardsHtml = filtered.map(createCard).join('');
  document.getElementById('home-games-grid').innerHTML = cardsHtml;
  document.getElementById('all-games-grid').innerHTML = cardsHtml;
}

function renderUpcoming() {
  document.getElementById('upcoming-grid').innerHTML = UPCOMING.map(u => `
    <article class="game-card rounded-xl overflow-hidden p-3 flex gap-3 items-center">
      <img src="${u.img}" alt="${u.title}" class="w-20 h-14 rounded-lg object-cover bg-zinc-950 flex-shrink-0">
      <div class="min-w-0 flex-1">
        <span class="text-[10px] font-mono text-zinc-500">${u.status}</span>
        <h4 class="font-display font-semibold text-sm text-white truncate">${u.title}</h4>
        <p class="text-[11px] text-zinc-400 truncate">${u.desc}</p>
      </div>
    </article>
  `).join('');
}

// --- VIEW NAVIGATION ---
function switchView(viewId) {
  document.querySelectorAll('.view-panel').forEach(p => p.classList.add('hidden'));
  const activePanel = document.getElementById('view-' + viewId);
  if (activePanel) activePanel.classList.remove('hidden');

  // Sync nav buttons
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-view') === viewId);
  });

  // Titles
  const titles = {
    'home': 'Home',
    'all-games': 'Instant Plays',
    'upcoming': 'Upcoming Games'
  };
  document.getElementById('page-title').textContent = titles[viewId] || 'Games';
  document.getElementById('content-scroll').scrollTop = 0;
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    switchView(btn.getAttribute('data-view'));
  });
});

// Category filtering
document.querySelectorAll('.cat-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-filter').forEach(b => b.classList.remove('active', 'text-zinc-300', 'font-medium'));
    btn.classList.add('active', 'text-zinc-300', 'font-medium');
    currentCategory = btn.getAttribute('data-cat');
    document.getElementById('active-cat-name').textContent = btn.querySelector('.nav-label').textContent;
    renderGames();
  });
});

// Search input
document.getElementById('search-box').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  renderGames();
});

// Collapse sidebar toggle
document.getElementById('btn-collapse').addEventListener('click', () => {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('w-64');
  sidebar.classList.toggle('w-16');
  document.querySelectorAll('.nav-label').forEach(el => el.classList.toggle('hidden'));
  document.querySelector('.sidebar-categories').classList.toggle('hidden');
});

// --- IN-APP PLAYER MODAL ---
function launchGame(gameId) {
  const g = GAMES.find(item => item.id === gameId);
  if (!g) return;

  currentModalUrl = g.url;
  document.getElementById('modal-title').textContent = g.title;
  document.getElementById('modal-genre').textContent = g.genre;
  document.getElementById('game-iframe').src = g.url;
  document.getElementById('game-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('game-modal').classList.add('hidden');
  document.getElementById('game-iframe').src = 'about:blank';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-reload').addEventListener('click', () => {
  const frame = document.getElementById('game-iframe');
  frame.src = frame.src;
});
document.getElementById('modal-popout').addEventListener('click', () => {
  if (currentModalUrl) window.open(currentModalUrl, '_blank');
});
document.getElementById('modal-fullscreen').addEventListener('click', () => {
  const modal = document.getElementById('game-modal');
  if (!document.fullscreenElement) {
    modal.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// --- AUTH BRIDGE ---
async function checkAuth() {
  try {
    const res = await fetch('https://authfordev.dverse.fun/api/user', { credentials: 'include' });
    if (!res.ok) return;
    const user = await res.json();
    document.getElementById('btn-signin').classList.add('hidden');
    document.getElementById('user-profile').classList.remove('hidden');
    document.getElementById('user-name').textContent = user.name || 'Player';
    document.getElementById('user-credits').textContent = `${user.credits || 0} Credits`;
    if (user.avatarUrl) {
      document.getElementById('user-avatar').src = user.avatarUrl;
    }
  } catch (err) {}
}

document.getElementById('btn-signin').addEventListener('click', () => {
  location.href = 'https://authfordev.dverse.fun/login?redirect_url=' + encodeURIComponent(location.href.split('?')[0]);
});
document.getElementById('btn-signout').addEventListener('click', () => {
  location.href = 'https://authfordev.dverse.fun/logout?redirect_url=' + encodeURIComponent(location.href);
});

// Init
renderFeatured();
renderGames();
renderUpcoming();
checkAuth();
</script>
</body>
</html>
