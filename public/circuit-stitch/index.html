<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#d9d1be"><title>Circuit Stitch — D'Games</title><link rel="stylesheet" href="/assets/dgames-ui.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d1be;color:#242a2a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{touch-action:none;user-select:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;z-index:4;top:max(76px,calc(env(safe-area-inset-top) + 68px));left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:7px 9px;border:2px solid #242a2a55;border-radius:11px;background:#eee8d9ed;box-shadow:0 4px 0 #242a2a18;pointer-events:none}.stat{min-width:64px;text-align:center}.stat small{display:block;color:#6f746e;font:900 7px/1 ui-monospace,monospace;letter-spacing:.12em}.stat b{display:block;margin-top:4px;font:900 16px/1 ui-monospace,monospace}#status{color:#a45949}.legend{position:fixed;z-index:4;left:50%;top:max(125px,calc(env(safe-area-inset-top) + 116px));transform:translateX(-50%);padding:6px 10px;border:1px solid #242a2a2b;border-radius:8px;background:#eee8d9df;color:#626963;font:800 7px/1.3 ui-monospace,monospace;text-align:center;pointer-events:none}.controls{position:fixed;z-index:5;left:50%;bottom:max(62px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.control{min-width:68px;min-height:40px;border:2px solid #242a2a5a;border-radius:10px;background:#eee8d9ef;color:#242a2a;font:900 8px/1 ui-monospace,monospace;box-shadow:0 4px 0 #242a2a18;cursor:pointer}.control:active{transform:translateY(2px);box-shadow:0 2px 0 #242a2a18}.control:focus-visible{outline:3px solid #718466;outline-offset:3px}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:22px;background:#242a2a35;backdrop-filter:blur(4px)}.panel{width:min(430px,100%);padding:24px;border:2px solid #242a2a70;border-radius:17px;background:#eee8d9f7;box-shadow:0 12px 0 #242a2a18,0 25px 70px #242a2a25;text-align:center}.eyebrow{font:900 8px/1 ui-monospace,monospace;letter-spacing:.18em;color:#718466}.panel h1{margin:11px 0 8px;font:900 clamp(38px,10vw,54px)/.9 Inter,sans-serif;letter-spacing:-.06em}.panel p{margin:0 auto;color:#666d68;font-size:12px;line-height:1.55;max-width:345px}#start{width:100%;min-height:48px;margin-top:16px;border:2px solid #242a2a;border-radius:11px;background:#242a2a;color:#eee8d9;font:900 10px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}@media(max-width:520px){.hud{top:max(70px,calc(env(safe-area-inset-top) + 62px))}.stat{min-width:58px}.stat b{font-size:14px}.legend{top:max(118px,calc(env(safe-area-inset-top) + 108px));max-width:calc(100% - 30px)}.controls{bottom:max(58px,calc(env(safe-area-inset-bottom) + 54px));width:calc(100% - 22px)}.control{flex:1;min-width:0}}@media(orientation:landscape) and (max-height:560px){.hud{top:58px}.legend{top:104px}.controls{bottom:43px}.control{min-height:34px}}</style></head><body class="dg-retro-skin" data-game="circuit-stitch"><canvas id="game" aria-label="Circuit Stitch puzzle board"></canvas><div class="hud" aria-live="polite"><div class="stat"><small>LEVEL</small><b id="level">01</b></div><div class="stat"><small>MOVES</small><b id="moves">000</b></div><div class="stat"><small>SCORE</small><b id="score">00000</b></div><div class="stat"><small>LINK</small><b id="status">OFF</b></div></div><div class="legend">ROTATE TILES TO LIGHT A PATH · TAP / SPACE / R · ARROWS MOVE SELECTOR</div><div class="controls"><button class="control" id="rotate" type="button">ROTATE ↻</button><button class="control" id="hintBtn" type="button">HINT · 75</button><button class="control" id="newBtn" type="button">NEW GRID</button></div><div id="overlay" class="overlay"><section class="panel" role="dialog"><div class="eyebrow">D'GAMES · CIRCUIT LAB</div><h1>Circuit Stitch</h1><p id="message">Every tile hides a wire. Rotate the pieces until power travels from the source to the target. Fewer turns and faster solves mean a higher score.</p><button id="start" type="button">Power the board</button></section></div><script src="/assets/dgames-ui.js"></script><script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),lev=document.getElementById('level'),mov=document.getElementById('moves'),scr=document.getElementById('score'),stat=document.getElementById('status'),ov=document.getElementById('overlay'),start=document.getElementById('start'),rotateBtn=document.getElementById('rotate'),hintBtn=document.getElementById('hintBtn'),newBtn=document.getElementById('newBtn');let W=0,H=0,dpr=1,running=false,raf=0,last=0,level=1,moves=0,score=0,best=+localStorage.getItem('circuit-stitch-best')||0,cols=4,rows=4,cell=0,ox=0,oy=0,tiles=[],solution=[],selected=0,linked=[],solved=0,startAt=0,hintUntil=0,flash=0;const D=[[0,-1],[1,0],[0,1],[-1,0]],O=[2,3,0,1];function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);layout()}function layout(){const top=Math.max(158,Math.min(H*.25,205)),bottom=Math.max(98,H*.17),aw=Math.min(W-24,620),ah=Math.max(180,H-top-bottom);cell=Math.max(38,Math.min(112,Math.floor(Math.min(aw/cols,ah/rows))));ox=(W-cols*cell)/2;oy=top+(ah-rows*cell)/2}addEventListener('resize',resize,{passive:true});function idx(a,b){return b*cols+a}function inside(a,b){return a>=0&&b>=0&&a<cols&&b<rows}function rot(m){return((m<<1)&15)|(m>>3)}function add(a,b,d){solution[a]|=1<<d;solution[b]|=1<<O[d]}function generate(){solution=new Array(cols*rows).fill(0);const seen=new Set([0]),stack=[0];while(stack.length){const q=stack[stack.length-1],qx=q%cols,qy=Math.floor(q/cols),opts=[];for(let d=0;d<4;d++){const nx=qx+D[d][0],ny=qy+D[d][1],n=idx(nx,ny);if(inside(nx,ny)&&!seen.has(n))opts.push([d,n])}if(!opts.length){stack.pop();continue}const z=opts[Math.floor(Math.random()*opts.length)];add(q,z[1],z[0]);seen.add(z[1]);stack.push(z[1])}tiles=solution.map(m=>{let q=m;for(let i=0;i<Math.floor(Math.random()*4);i++)q=rot(q);return{mask:q,base:m}});selected=Math.floor(cols*rows/2);moves=0;linked=[];solved=0;hintUntil=0;startAt=performance.now();sync()}function sync(){lev.textContent=String(level).padStart(2,'0');mov.textContent=String(moves).padStart(3,'0');scr.textContent=String(score).padStart(5,'0');stat.textContent=linked[cols*rows-1]?'ON':'OFF';stat.style.color=linked[cols*rows-1]?'#5e8150':'#a45949';hintBtn.textContent=score>=75?'HINT · 75':'HINT · LOCKED'}function startGame(){ov.style.display='none';running=true;level=1;score=0;cols=4;rows=4;generate();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function rotate(){if(!running||solved)return;tiles[selected].mask=rot(tiles[selected].mask);moves++;flash=.1;check();sync()}function check(){linked=new Array(cols*rows).fill(false);linked[0]=true;const q=[0];while(q.length){const n=q.shift(),a=n%cols,b=Math.floor(n/cols),m=tiles[n].mask;for(let d=0;d<4;d++)if(m&(1<<d)){const na=a+D[d][0],nb=b+D[d][1];if(inside(na,nb)){const k=idx(na,nb);if((tiles[k].mask&(1<<O[d]))&&!linked[k]){linked[k]=true;q.push(k)}}}}if(linked[cols*rows-1])win()}function win(){if(solved)return;solved=performance.now();const sec=(solved-startAt)/1000,n=cols*rows,eff=Math.max(.1,1-(moves-n*.55)/(n*2.4));score+=Math.round(180*level+Math.max(0,900-sec*18)*eff);best=Math.max(best,score);localStorage.setItem('circuit-stitch-best',best);flash=1;sync();setTimeout(()=>{if(!running)return;level++;const s=Math.min(7,4+Math.floor((level-1)/2));cols=s;rows=s;layout();generate()},900)}function hint(){if(!running||solved||score<75)return;score-=75;const bad=[];for(let i=0;i<tiles.length;i++)if(tiles[i].mask!==tiles[i].base)bad.push(i);const i=bad.length?bad[Math.floor(Math.random()*bad.length)]:Math.floor(Math.random()*tiles.length);tiles[i].mask=tiles[i].base;selected=i;hintUntil=performance.now()+1200;check();sync()}function move(dx,dy){if(!running)return;const a=selected%cols,b=Math.floor(selected/cols);selected=idx((a+dx+cols)%cols,(b+dy+rows)%rows)}function tap(e){if(!running)return;const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,a=Math.floor((px-ox)/cell),b=Math.floor((py-oy)/cell);if(!inside(a,b))return;selected=idx(a,b);rotate()}function draw(){x.fillStyle='#d9d1be';x.fillRect(0,0,W,H);x.globalAlpha=.1;x.strokeStyle='#242a2a';x.lineWidth=1;for(let a=0;a<W;a+=32){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let b=0;b<H;b+=32){x.beginPath();x.moveTo(0,b);x.lineTo(W,b);x.stroke()}x.globalAlpha=1;const now=performance.now();for(let i=0;i<tiles.length;i++){const a=i%cols,b=Math.floor(i/cols),px=ox+a*cell,py=oy+b*cell,p=cell*.055,s=cell-p*2;x.fillStyle='#eee8d9';x.strokeStyle=i===selected?'#a45949':'#242a2a45';x.lineWidth=i===selected?3:1.5;x.beginPath();x.roundRect(px+p,py+p,s,s,Math.max(7,cell*.09));x.fill();x.stroke();if(linked[i]){x.fillStyle='#8fc26f';x.globalAlpha=.13;x.fillRect(px+p,py+p,s,s);x.globalAlpha=1}const cx=px+cell/2,cy=py+cell/2;x.strokeStyle=linked[i]?'#5e8150':'#60716d';x.lineWidth=Math.max(4,cell*.075);x.lineCap='round';x.beginPath();x.moveTo(cx,cy);for(let d=0;d<4;d++)if(p&&tiles[i].mask&(1<<d)){x.lineTo(cx+D[d][0]*(cell*.44),cy+D[d][1]*(cell*.44));x.moveTo(cx,cy)}x.stroke();x.fillStyle=linked[i]?'#a6d57d':'#7b8e88';x.beginPath();x.arc(cx,cy,Math.max(7,cell*.08),0,Math.PI*2);x.fill();x.fillStyle='#242a2a';x.font='900 '+Math.max(8,cell*.1)+'px ui-monospace,monospace';x.textAlign='center';if(i===0)x.fillText('POWER',cx,py+cell*.82);if(i===tiles.length-1)x.fillText('TARGET',cx,py+cell*.82);if(i===selected){x.strokeStyle='#a45949';x.lineWidth=2;x.setLineDash([4,4]);x.strokeRect(px+p+5,py+p+5,s-10,s-10);x.setLineDash([])}if(hintUntil>now&&i===selected){x.fillStyle='#a45949';x.fillText('HINT',cx,py+cell*.2)}}if(solved&&now-solved<850){const q=(now-solved)/850;x.globalAlpha=1-q;x.strokeStyle='#8fc26f';x.lineWidth=4;x.beginPath();x.arc(W/2,oy+rows*cell/2,Math.min(W,H)*.18*q,0,Math.PI*2);x.stroke();x.globalAlpha=1;x.fillStyle='#5e8150';x.font='900 '+Math.max(18,Math.min(32,W*.06))+'px ui-monospace,monospace';x.textAlign='center';x.fillText('LINKED',W/2,oy+rows*cell+30)}if(flash>0){x.globalAlpha=flash*.16;x.fillStyle='#f3f0e4';x.fillRect(0,0,W,H);x.globalAlpha=1;flash=Math.max(0,flash-.035)}}function loop(now){if(!running)return;last=now;draw();raf=requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{e.preventDefault();tap(e)});rotateBtn.addEventListener('click',rotate);hintBtn.addEventListener('click',hint);newBtn.addEventListener('click',()=>{if(running)generate()});start.addEventListener('click',startGame);addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','r',' ','enter'].includes(k))e.preventDefault();if(!running){if(k==='enter'||k===' ')startGame();return}if(k==='arrowup'||k==='w')move(0,-1);else if(k==='arrowdown'||k==='s')move(0,1);else if(k==='arrowleft'||k==='a')move(-1,0);else if(k==='arrowright'||k==='d')move(1,0);else if(k==='r'||k===' '||k==='enter')rotate();sync()},{passive:false});resize();draw()})();
</script></body></html>
